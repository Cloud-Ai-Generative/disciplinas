.acoes{display:flex;gap:6px;flex-wrap:wrap}
.acoes button{

  cursor:pointer;font-weight:600;font-size:.85rem
}
.acoes button:hover{background:var(--cor-suave)}
nav.tabs{
  position:sticky;top:56px;z-index:90;background:var(--painel);
  border-bottom:2px solid var(--borda);overflow-x:auto;white-space:nowrap;
  scrollbar-width:thin
}
nav.tabs button{
  font-family:var(--fonte);font-size:var(--tam);background:transparent;color:var(--texto);
  border:none;padding:12px 16px;cursor:pointer;border-bottom:4px solid transparent;
  margin:0;font-weight:600;position:relative;opacity:.75
}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-selected="true"]{
  color:var(--cor);border-bottom-color:var(--cor);opacity:1;
  background:var(--painel);
}
nav.tabs button .selo{font-size:.7rem;background:var(--cor);color:#fff;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
main{max-width:980px;margin:0 auto;padding:20px}
section.aba{display:none;animation:fade .3s ease}
section.aba.ativa{display:block}

.missao{

}
.missao strong{display:block;font-size:1.1rem;margin-bottom:4px}
.demo{
  background:var(--suave2, #f5f0ff);border:2px solid var(--cor);border-radius:10px;
  padding:16px;margin:18px 0

body.dark .demo{background:#2a1d3a}
.demo h3{color:var(--cor);margin-top:0}
.instru{

body.dark .instru{background:#3a2d10}
.preveja{

body.dark .obs{background:#153047}
button.btn{

button.btn.sec{background:#6c757d}

.fb.ok{background:#d4edda;border-left:5px solid var(--ok);color:#155724;display:block}
.fb.bad{background:#f8d7da;border-left:5px solid var(--erro);color:#721c24;display:block}
body.dark .fb.ok{background:#1e3a1e;color:#a8e6a8}
body.dark .fb.bad{background:#3a1e1e;color:#ffb3b3}
details{background:var(--suave2,#fafafa);border:1px solid var(--borda);border-radius:8px;padding:8px 12px;margin:10px 0}
body.dark details{background:#222}
details summary{cursor:pointer;font-weight:600;color:var(--cor)}
details[open] summary{margin-bottom:8px}
details.lex{background:#fff3e0;border-color:#ffb74d}
details.links{background:#e8f5e9;border-color:#81c784}
details.links a{color:var(--cor);font-weight:600}

.xp{background:var(--cor);color:#fff;padding:3px 10px;border-radius:20px;font-weight:700}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo{background:var(--cor-suave);color:var(--cor);padding:3px 8px;border-radius:20px;font-size:.8rem;font-weight:600}

  background:#e0f7fa;border-left:5px solid #0097a7;padding:10px 14px;border-radius:6px;
  margin:10px 0;font-size:.9rem

body.dark .rota{background:#0c2d33;color:#b3e5fc}
body.apresentacao{font-size:22px}
body.apresentacao nav.tabs button{font-size:22px}
body.apresentacao .rota-apres{
  position:fixed;bottom:0;left:0;right:0;background:#263238;color:#fff;

.revisao-mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.revisao-mapa .no{

.revisao-mapa .no strong{color:var(--cor)}
.cola{background:#fff3cd;border-left:5px solid #ffc107;padding:12px 16px;border-radius:8px;font-family:"Courier New",monospace;font-size:.95rem;white-space:pre-wrap}
body.dark .cola{background:#3a2d10;color:#ffd980}
.chefao{
  background:linear-gradient(135deg,#263238,#37474f);color:#fff;padding:18px;border-radius:12px;margin-top:18px

.chefao h3{color:#ffd54f;margin-top:0}
.chefao button{background:#ffd54f;color:#263238}
footer{max-width:980px;margin:30px auto;padding:20px;text-align:center;color:var(--muted);font-size:.85rem}
@media(max-width:600px){
  main{padding:12px}
  .card{padding:14px}
  header.topo h1{font-size:.95rem}
}
</style>

const estado = {
  xp:0,

  quizOk:new Set(),

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('so_aula01')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('so_aula01',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function renderTabs(){
  const nav = document.getElementById('tablist');
  nav.innerHTML = '';
  const todas = [...AULA_DADOS.abas,{id:'revisao',titulo:'Revisão'}];
  todas.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.setAttribute('aria-selected','false');
    btn.setAttribute('aria-controls',a.id);
    btn.dataset.id = a.id;
    btn.innerHTML = `${i+1}. ${a.titulo}${a.estudoProprio?'<span class="selo">📖 Estudo próprio</span>':''}`;
    btn.onclick = ()=>irPara(a.id);
    btn.onkeydown = (e)=>{
      if(e.key==='ArrowRight'){
        const next = btn.nextElementSibling||nav.firstElementChild;
        next.focus();
      } else if(e.key==='ArrowLeft'){
        const prev = btn.previousElementSibling||nav.lastElementChild;
        prev.focus();
      } else if(e.key==='Enter'||e.key===' '){
        e.preventDefault();irPara(a.id);
      }
    };
    nav.appendChild(btn);
  });
}

function renderMain(){
  const m = document.getElementById('main');
  m.innerHTML = '';
  const pr = document.createElement('div');
  pr.className='progresso';
  pr.id='progresso';
  m.appendChild(pr);
  AULA_DADOS.abas.forEach(a=>{
    const sec = document.createElement('section');
    sec.className='aba';
    sec.id=a.id;
    sec.setAttribute('role','tabpanel');
    sec.innerHTML = renderAba(a);
    m.appendChild(sec);
  });
  const rev = document.createElement('section');
  rev.className='aba';rev.id='revisao';
  rev.setAttribute('role','tabpanel');
  rev.innerHTML = renderRevisao();
  m.appendChild(rev);
  atualizaProgresso();
}

  `;

}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map((alt,i)=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}

function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const retryKey = key+'-retry';
      const wasRetry = sessionStorage.getItem(retryKey);
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(retryKey);
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)){
      sessionStorage.setItem(key+'-retry','1');
    }
  }
}

function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\s]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));

}

/* ABA 2 — Fila Batch */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  let fila = [];
  function desenha(){
    wrap.innerHTML = `
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">

        <div id="ab2-fila" style="margin-top:8px;min-height:40px">${fila.map((j,i)=>`<span style="display:inline-block;background:#ede7f6;padding:4px 8px;border-radius:4px;margin:2px;font-size:.9rem">#${i+1} ${j.nome}</span>`).join('')||'<em>Vazia</em>'}</div>
      </div>
      <div style="margin-top:10px">
        <button class="btn" id="ab2-rodar" ${fila.length===0?'disabled':''}>▶️ Processar lote</button>
        <button class="btn sec" id="ab2-limpar">🗑️ Limpar fila</button>
      </div>
      <div id="ab2-log" style="margin-top:12px;padding:10px;background:#f5f0ff;border-radius:6px;font-family:monospace;min-height:40px;font-size:.9rem"></div>
    `;
    wrap.querySelectorAll('button[data-i]').forEach(b=>{
      b.onclick = ()=>{ fila.push(a.demo.tipos[+b.dataset.i]); desenha(); };
    });
    wrap.querySelector('#ab2-limpar').onclick = ()=>{ fila=[]; desenha(); };
    wrap.querySelector('#ab2-rodar').onclick = ()=>rodarBatch();
  }
  function rodarBatch(){
    const log = wrap.querySelector('#ab2-log');
    log.innerHTML='🚀 Iniciando processamento batch...\n';
    let i = 0;
    let acumulado = 0;
    const timer = setInterval(()=>{
      if(i>=fila.length){
        clearInterval(timer);
        log.innerHTML += `\n✅ Lote concluído em ${acumulado}s\n⏱️  Sem interação humana durante execução — você só veria o resultado horas depois (em 1960, impresso).`;
        estado.demos.aba2 = {parar:()=>clearInterval(timer)};
        return;
      }
      const j = fila[i];
      if(j.tempo===-1){
        log.innerHTML += `\n❌ #${i+1} ${j.nome} — TRAVOU! Todos os jobs seguintes esperam indefinidamente.`;
        clearInterval(timer);
        log.innerHTML += `\n\n⚠️  Esse era o problema clássico do batch: um job ruim paralisava o lote inteiro.`;
        return;
      }
      acumulado += j.tempo;
      log.innerHTML += `\n⏳ #${i+1} ${j.nome} — rodando... (${j.tempo}s) — total: ${acumulado}s`;
      i++;
    },700);
    estado.demos.aba2 = {parar:()=>clearInterval(timer)};
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 3 — Multitarefa time-slice */
function renderDemoAba3(area,a){
  const wrap = document.createElement('div');
  const canvas = document.createElement('canvas');
  canvas.width = 580; canvas.height = 120;
  canvas.style.cssText='width:100%;max-width:580px;background:#fff;border-radius:8px;border:1px solid #ccc';
  wrap.appendChild(canvas);
  const info = document.createElement('div');
  info.style.cssText='margin-top:8px;font-family:monospace;font-size:.9rem';
  wrap.appendChild(info);
  const controles = document.createElement('div');
  controles.innerHTML = `
    <button class="btn" id="ab3-play">▶️ Rodar simulação</button>
    <button class="btn sec" id="ab3-stop">⏸️ Parar</button>
    <span style="margin-left:10px">Legenda: ${a.demo.processos.map(p=>`<span style="display:inline-block;width:12px;height:12px;background:${p.cor};vertical-align:middle;margin-left:6px"></span>${p.nome}`).join(' · ')}</span>
  `;
  wrap.appendChild(controles);
  area.appendChild(wrap);
  
  const ctx = canvas.getContext('2d');
  let timer = null;
  let x = 0;
  let currentProc = 0;
  let ticks = 0;
  
  function parar(){ if(timer){clearInterval(timer);timer=null;} }
  
  function rodar(){
    parar();
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    x=0; ticks=0;
    timer = setInterval(()=>{
      if(x>=canvas.width){ x=0; ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
      const p = a.demo.processos[currentProc];
      ctx.fillStyle = p.cor;
      ctx.fillRect(x,10,4,100);
      x+=4;
      ticks++;
      if(ticks%3===0){ // troca de contexto a cada 3 ticks
        currentProc = (currentProc+1) % a.demo.processos.length;
        ctx.fillStyle='#888';
        ctx.fillRect(x,10,2,100); // cinza = troca de contexto
        x+=2;
      }
      info.innerHTML = `CPU rodando: <strong style="color:${p.cor}">${p.nome}</strong> | Trocas de contexto: ${Math.floor(ticks/3)} | Cada processo ganha ~33% da CPU ao longo do tempo`;
    },60);
  }
  estado.demos.aba3 = {parar};
  controles.querySelector('#ab3-play').onclick = rodar;
  controles.querySelector('#ab3-stop').onclick = parar;
  rodar();
}

  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';
    r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio. Aba "Revisão" fecha os 30 min.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
</body>
</html>
