        "Isolamento: endereço lógico por processo, MMU com base/limite ou paginação; trap em acesso inválido",

        "IPC: pipe ex. 'ls /var/app | gzip > lista.gz' conectando saída e entrada de processos"
      ]
    }
  }
};

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<160){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Cubra os 5 pontos.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/shebang|#!\/bin\/bash|chmod/.test(lower)) pontos++;
  if(/syscall|open|write|mkdir|ext4|arquivo/.test(lower)) pontos++;
  if(/base|limite|mmu|p[áa]gina|endere[çc]o l[óo]gico/.test(lower)) pontos++;
  if(/mutex|lock|flock|semaforo|sem[áa]foro|corrida/.test(lower)) pontos++;
  if(/pipe|\||gzip|ipc/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Solução aprovada!</strong> Você cobriu ${pontos}/5 pontos. Ganhou 50 XP e o selo "Mestre do Shell".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Mestre do Shell');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/5 pontos. Reveja: shebang+chmod, syscalls/arquivos, MMU base/limite, mutex/flock contra corrida, pipe como IPC.`;
  }
}

/* ABA 1 — MMU base/limite */
function renderDemoAba1(area,a){
  const wrap = document.createElement('div');
  const st = {base:3000, lim:2000, log:1500};
  function desenha(){
    const ok = st.log < st.lim;
    const fis = st.base + st.log;
    wrap.innerHTML = `
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <label>Base:<br><input type="number" id="m-b" value="${st.base}"></label>
        <label>Limite:<br><input type="number" id="m-l" value="${st.lim}"></label>
        <label>End. lógico:<br><input type="number" id="m-a" value="${st.log}"></label>
      </div>
      <div style="margin-top:12px;padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor)">
        <div style="font-family:'Courier New',monospace;font-size:.95rem">
          CPU (processo) → [ lógico = ${st.log} ] → <strong>MMU</strong> → ${ok?`[ físico = ${st.base} + ${st.log} = <strong>${fis}</strong> ] → RAM ✅`:`<strong>TRAP! ${st.log} ≥ limite ${st.lim}</strong> → SO encerra o processo 🚫`}
        </div>
        <div style="margin-top:10px;padding:10px;border-radius:6px;background:${ok?'#e8f5e9':'#f8d7da'};border-left:5px solid ${ok?'var(--ok)':'var(--erro)'}">
          ${ok?`✅ <strong>Acesso permitido.</strong> O físico ${fis} cai dentro da região alocada (base ${st.base} .. ${st.base+st.lim-1}).`
              :`❌ <strong>Violação de proteção.</strong> O processo tentou ultrapassar seu limite. A MMU interrompe a CPU e o SO trata o erro (fim do processo).`}
        </div>
      </div>
    `;
    wrap.querySelector('#m-b').oninput=e=>{st.base=+e.target.value||0;desenha();};
    wrap.querySelector('#m-l').oninput=e=>{st.lim=+e.target.value||0;desenha();};
    wrap.querySelector('#m-a').oninput=e=>{st.log=+e.target.value||0;desenha();};
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 2 — Ciclos de barramento */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  const ops = {
    leitura:{rot:"📖 Leitura da RAM",ticks:[
      {d:"CPU coloca endereço no BARRAMENTO DE ENDEREÇOS + sinal LER no CONTROLE",b:[1,2]},
      {d:"Memória decodifica o endereço e prepara o conteúdo",b:[2]},
      {d:"Memória coloca o conteúdo no BARRAMENTO DE DADOS",b:[0,2]},
      {d:"CPU captura o dado; ciclo concluído",b:[0]}
    ]},
    escrita:{rot:"✍️ Escrita na RAM",ticks:[
      {d:"CPU coloca endereço no BARR. DE ENDEREÇOS + dado no BARR. DE DADOS",b:[0,1]},
      {d:"CPU ativa sinal ESCREVER no BARRAMENTO DE CONTROLE",b:[2]},
      {d:"Memória grava o dado na posição indicada",b:[2]},
      {d:"Ciclo concluído; barramentos liberados",b:[]}
    ]},
    eSaida:{rot:"🖨️ Leitura de dispositivo de E/S (via controlador)",ticks:[
      {d:"CPU coloca PORTA de E/S no BARR. DE ENDEREÇOS + LER no CONTROLE",b:[1,2]},
      {d:"Controlador do dispositivo busca o dado no seu registrador",b:[2]},
      {d:"Controlador coloca o dado no BARRAMENTO DE DADOS",b:[0,2]},
      {d:"CPU lê o dado; se fosse DMA, a CPU nem participaria destes ticks",b:[0]}
    ]}
  };
  let timer=null;
  function parar(){if(timer){clearInterval(timer);timer=null;}}
  function desenha(opKey,tick,log){
    const op = ops[opKey||'leitura'];
    const t = opKey ? op.ticks[Math.min(tick,op.ticks.length-1)] : null;
    wrap.innerHTML = `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${Object.keys(ops).map(k=>`<button class="btn" data-op="${k}" style="background:${opKey===k?'var(--cor)':'#6c757d'}">${ops[k].rot}</button>`).join('')}
      </div>
      <div class="busline ${t&&t.b.includes(0)?'on':''}">BARRAMENTO DE DADOS ${t&&t.b.includes(0)?'⚡ ATIVO':'—'}</div>
      <div class="busline ${t&&t.b.includes(1)?'on':''}">BARRAMENTO DE ENDEREÇOS ${t&&t.b.includes(1)?'⚡ ATIVO':'—'}</div>
      <div class="busline ${t&&t.b.includes(2)?'on':''}">BARRAMENTO DE CONTROLE ${t&&t.b.includes(2)?'⚡ ATIVO':'—'}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="b-run">▶ Executar ciclo</button>
        <button class="btn sec" id="b-stop">⏹ Parar</button>
      </div>
      <div class="console" style="margin-top:10px;min-height:90px">${log||'Escolha a operação e execute o ciclo.'}</div>
    `;
    wrap.querySelectorAll('[data-op]').forEach(b=>{
      b.onclick=()=>{parar();desenha(b.dataset.op,-1,'');};
    });
    wrap.querySelector('#b-stop').onclick=()=>parar();
    wrap.querySelector('#b-run').onclick=()=>{
      parar();
      const k = opKey||'leitura';
      let i=0; let log='';
      timer=setInterval(()=>{
        const tk = ops[k].ticks[i];
        log += `tick ${i+1}: ${tk.d}\n`;
        desenha(k,i,log);
        i++;
        if(i>=ops[k].ticks.length){
          parar();
          log += '✅ Ciclo completo.\n';
          desenha(k,ops[k].ticks.length-1,log);
        }
      },900);
    };
  }
  area.appendChild(wrap);
  desenha(null,-1,'');
  estado.demos.aba2 = {parar};
}

/* ABA 5 — Condição de corrida */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  let timer=null;
  function parar(){if(timer){clearInterval(timer);timer=null;}}
  function desenha(log,final){
    wrap.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="r-sem" style="background:#c62828">🏃 Rodar SEM trava</button>
        <button class="btn" id="r-com" style="background:#2e7d32">🔒 Rodar COM mutex</button>
        <button class="btn sec" id="r-stop">⏹ Parar</button>
      </div>
      <div class="console" style="margin-top:10px;min-height:140px">${log||'Contador compartilhado = 0. Processos A e B farão contador++ cada um.\nEscolha um modo e observe a intercalação.'}</div>
      ${final!==undefined?`<div style="margin-top:8px;padding:10px;border-radius:6px;background:${final===2?'#d4edda':'#f8d7da'};border-left:5px solid ${final===2?'var(--ok)':'var(--erro)'};font-weight:700">Resultado final do contador: ${final} ${final===2?'(correto ✅)':'(INCORRETO — atualização perdida 🐛)'}</div>`:''}
    `;
    wrap.querySelector('#r-stop').onclick=()=>parar();
    wrap.querySelector('#r-sem').onclick=()=>rodar(false);
    wrap.querySelector('#r-com').onclick=()=>rodar(true);
  }
  function rodar(comLock){
    parar();
    const passos = comLock ? [
      'A: obtém mutex 🔒','A: lê contador (0)','A: soma 1 → 1','A: escreve 1','A: libera mutex 🔓',
      'B: obtém mutex 🔒','B: lê contador (1)','B: soma 1 → 2','B: escreve 2','B: libera mutex 🔓','✅ Final: 2'
    ] : [
      'A: lê contador (0)','B: lê contador (0)  ← intercalação perversa','A: soma 1 → 1','B: soma 1 → 1',
      'A: escreve 1','B: escreve 1  ← sobrescreve o valor de A!','🐛 Final: 1 (esperado 2)'
    ];
    let i=0; let log='';
    timer=setInterval(()=>{
      log += passos[i]+'\n';
      const fim = (i===passos.length-1);
      desenha(log, fim ? (comLock?2:1) : undefined);
      i++;
      if(i>=passos.length) parar();
    },650);
  }
  area.appendChild(wrap);
  desenha('');
  estado.demos.aba5 = {parar};
}

/* ABA 6 — Mini-shell */
function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  const scriptInicial = [
    '#!/bin/bash',
    '# backup.sh — demo de shell script',
    'mkdir backup',
    'touch backup/notas.txt',
    'echo relatorio-2026 > backup/notas.txt',
    'ls',
    'cat backup/notas.txt'
  ].join('\n');
  let timer=null;
  function parar(){if(timer){clearInterval(timer);timer=null;}}
  function desenha(out,fs){
    wrap.innerHTML = `
      <textarea class="script" id="s-txt">${scriptAtual()}</textarea>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="s-run">▶ Executar script</button>
        <button class="btn sec" id="s-stop">⏹ Parar</button>
      </div>
      <div class="console" style="margin-top:10px">$ ./backup.sh\n${out||'(sem saída ainda)'}</div>
      <div style="margin-top:10px;padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);font-family:'Courier New',monospace;font-size:.85rem">
        <strong>📁 Sistema de arquivos virtual:</strong><br>${fs && fs.size?Array.from(fs.entries()).map(([k,v])=>`${k.includes('.')?'📄':'📁'} ${k}${v!==null?` → "${v}"`:''}`).join('<br>'):'(vazio)'}
      </div>
    `;
    wrap.querySelector('#s-stop').onclick=()=>parar();
    wrap.querySelector('#s-run').onclick=()=>{
      parar();
      const linhas = wrap.querySelector('#s-txt').value.split('\n');
      const fs = new Map();
      let out=''; let i=0;
      timer=setInterval(()=>{
        if(i>=linhas.length){ parar(); out+='\n$ (script concluído — exit 0)'; desenha(out,fs); return; }
        const raw = linhas[i].trim(); i++;
        if(!raw || raw.startsWith('#')){ return; }
        const mRedir = raw.match(/^echo\s+(.+?)\s*>\s*(\S+)$/);
        if(mRedir){ fs.set(mRedir[2], mRedir[1]); out+=`$ ${raw}\n`; desenha(out,fs); return; }
        const m = raw.match(/^(\w+)(?:\s+(.*))?$/);
        if(!m){ out+=`bash: ${raw}: comando não encontrado\n`; desenha(out,fs); return; }
        const cmd=m[1], arg=(m[2]||'').trim();
        switch(cmd){
          case 'echo': out+=`${arg}\n`; break;
          case 'mkdir': fs.set(arg,null); out+=`$ mkdir ${arg}\n`; break;
          case 'touch': fs.set(arg, fs.has(arg)?fs.get(arg):''); out+=`$ touch ${arg}\n`; break;
          case 'rm': fs.delete(arg); out+=`$ rm ${arg}\n`; break;
          case 'ls': out+=`$ ls\n${Array.from(fs.keys()).join('  ')||'(vazio)'}\n`; break;
          case 'cat':
            if(fs.has(arg)) out+=`$ cat ${arg}\n${fs.get(arg)}\n`;
            else out+=`cat: ${arg}: arquivo não encontrado\n`;
            break;
          default: out+=`bash: ${cmd}: comando não encontrado (demo suporta: echo, mkdir, touch, rm, ls, cat)\n`;
        }
        desenha(out,fs);
      },500);
    };
  }
  function scriptAtual(){ return scriptInicial; }
  area.appendChild(wrap);
  desenha('',new Map());
  estado.demos.aba6 = {parar};
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  if(estado.demos[abaId] && estado.demos[abaId].parar) estado.demos[abaId].parar();
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
