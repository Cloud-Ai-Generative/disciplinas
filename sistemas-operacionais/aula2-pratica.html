.revisao-mapa .no strong{color:var(--cor)}

footer{max-width:980px;margin:30px auto;padding:20px;text-align:center;color:var(--muted);font-size:.85rem}

const estado = {xp:0,selos:new Set(),quizOk:new Set(),demoOk:new Set(),dark:false,apres:false,abaAtiva:null,demos:{}};

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('so_aula02')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('so_aula02',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">

      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}
function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}
function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));
  }
}

  if(!estado.demoOk.has(abaId)){
    estado.demoOk.add(abaId);
    ganhaXP(5,'Demo concluída');

}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<150){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Desenvolva os 4 elementos da curadoria.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  // problema da década
  if(/problema|custo|interativ|lento|gui|seguran|portab|escala|mobile|cloud/.test(lower)) pontos++;
  // nome de SO histórico
  if(/unix|multics|ctss|dos|windows|linux|mac|android|ios|eniac|gm-naa|batch|kubernetes|docker/.test(lower)) pontos++;
  // legado moderno
  if(/hoje|2026|moderno|atual|legado|descend|herda|base|origem|influenci|atual/.test(lower)) pontos++;
  // conceito técnico
  if(/kernel|time-sharing|gui|multitarefa|preemptiv|container|microkernel|syscall|open.?source/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=3){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Excelente curadoria!</strong> Você cobriu ${pontos}/4 elementos. Ganhou 50 XP e o selo "Curador de SOs".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Curador de SOs');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/4 elementos. Reveja: problema da década + SO específico + legado em 2026 + conceito técnico.`;
  }
}

  function parar(){ if(timer){clearInterval(timer);timer=null;} }
  function desenha(){
    wrap.innerHTML = `

          ${fila.map((j,i)=>`<span style="display:inline-block;background:#efebe9;padding:6px 10px;border-radius:4px;margin:2px;border:1px solid #6d4c41;font-size:.9rem">#${i+1} ${j.nome}</span>`).join('')||'<em>Pilha vazia — adicione jobs acima</em>'}
        </div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">

        <button class="btn sec" id="ab2-clear">🗑️ Limpar pilha</button>
        <button class="btn sec" id="ab2-stop" style="display:none">⏸️ Parar execução</button>
      </div>
      <div id="ab2-log" style="margin-top:12px;padding:12px;background:#0a0a0a;color:#00ff66;border-radius:8px;font-family:'Courier New',monospace;min-height:80px;font-size:.9rem;white-space:pre-wrap">$ IBM 704 Batch System (GM-NAA I/O)\n$ Aguardando submissão...</div>
    `;
    wrap.querySelectorAll('button[data-i]').forEach(b=>{
      b.onclick = ()=>{ fila.push(a.demo.jobsDisponiveis[+b.dataset.i]); desenha(); };
    });
    wrap.querySelector('#ab2-clear').onclick = ()=>{ parar(); fila=[]; desenha(); };
    wrap.querySelector('#ab2-run').onclick = rodar;
    wrap.querySelector('#ab2-stop').onclick = ()=>{ parar(); };
  }
  function rodar(){
    const log = wrap.querySelector('#ab2-log');
    const stopBtn = wrap.querySelector('#ab2-stop');
    stopBtn.style.display='inline-block';
    log.textContent = '$ Iniciando execução batch...\n$ GM-NAA I/O carregando jobs sequencialmente...\n';
    let i = 0;
    let acumulado = 0;
    timer = setInterval(()=>{
      if(i>=fila.length){
        parar();
        log.textContent += `\n$ ✅ Lote concluído em ${acumulado}s.\n$ Tempo ocioso entre jobs: 0s (automação do GM-NAA I/O).`;
        stopBtn.style.display='none';
        return;
      }
      const j = fila[i];
      if(j.tempo===-1){
        log.textContent += `\n⛔ #${i+1} ${j.nome}\n$ JOB TRAVOU — execução suspensa.\n$ Os próximos ${fila.length-i-1} jobs ficaramão esperando indefinidamente.\n\n⚠️  Esse era o PROBLEMA do batch: um job ruim paralisava TUDO.`;
        parar();
        stopBtn.style.display='none';
        return;
      }
      log.textContent += `\n⏳ #${i+1} ${j.nome} (${j.tipo}) — rodando ${j.tempo}s...\n   acumulado: ${acumulado+j.tempo}s`;
      acumulado += j.tempo;
      i++;
    },800);
  }
  area.appendChild(wrap);
  desenha();
  estado.demos.aba2 = {parar};
}

function renderDemoAba3(area,a){
  const wrap = document.createElement('div');
  let history = ['$ Bem-vindo ao Unix V5 (Bell Labs, 1973)\n$ Digite "help" para ver comandos disponíveis\n'];
  function render(){
    wrap.innerHTML = `
      <div class="terminal" id="ab3-term">${history.join('\n')}</div>
      <div style="display:flex;gap:6px;margin-top:8px;align-items:center">
        <span style="font-family:'Courier New',monospace;color:var(--cor);font-weight:700">ken@unix:~$</span>
        <input id="ab3-input" type="text" placeholder="digite um comando..." style="flex:1;padding:8px;border-radius:6px;border:2px solid var(--cor);font-family:'Courier New',monospace">
        <button class="btn" id="ab3-send">Enter</button>
      </div>
      <div style="margin-top:8px;font-size:.85rem;color:var(--muted)">
        💡 Tente: <code>ls</code>, <code>pwd</code>, <code>whoami</code>, <code>date</code>, <code>echo oi</code>, <code>uname -a</code>, <code>ps aux</code>, <code>cat /etc/os-release</code>, <code>clear</code>
      </div>
    `;
    const term = wrap.querySelector('#ab3-term');
    term.scrollTop = term.scrollHeight;
    const input = wrap.querySelector('#ab3-input');
    input.focus();
    const send = ()=>{
      const cmd = input.value.trim();
      if(!cmd) return;
      history.push(`ken@unix:~$ ${cmd}`);
      if(cmd==='clear'){ history=['$ Terminal limpo.\n']; }
      else if(cmd.startsWith('echo ')){ history.push(cmd.substring(5)); }
      else if(a.demo.comandos[cmd]){ history.push(a.demo.comandos[cmd]); }
      else { history.push(`sh: ${cmd}: não encontrado. Digite "help" para ver comandos.`); }
      input.value='';
      render();
    };
    wrap.querySelector('#ab3-send').onclick = send;
    input.onkeydown = (e)=>{ if(e.key==='Enter') send(); };
  }
  area.appendChild(wrap);
  render();
}

      wrap.querySelectorAll('.decade-card').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      const s = a.demo.sos[+c.dataset.i];
      document.getElementById('ab4-reveal').innerHTML = `
        <strong>${s.nome}</strong><br><br>
        👤 <strong>Criador:</strong> ${s.criador}<br><br>
        <div style="padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000">
          💥 <strong>Impacto histórico:</strong> ${s.impacto}
        </div>
      `;
    };
  });
}

function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="marcos-grid">
      ${a.demo.marcos.map((m,i)=>`<div class="decade-card" data-i="${i}"><strong>${m.ano}</strong>${m.titulo}</div>`).join('')}
    </div>
    <div id="ab5-reveal" style="margin-top:14px;padding:14px;border-radius:8px;background:#efebe9;min-height:120px;border-left:5px solid var(--cor)">
      <em>👆 Clique em um marco moderno para ver seu impacto.</em>
    </div>
  `;
  area.appendChild(wrap);
  wrap.querySelectorAll('.decade-card').forEach(c=>{
    c.onclick=()=>{
      wrap.querySelectorAll('.decade-card').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      const m = a.demo.marcos[+c.dataset.i];
      document.getElementById('ab5-reveal').innerHTML = `
        <strong>${m.ano} — ${m.titulo}</strong><br><br>
        📖 ${m.texto}<br><br>
        <div style="padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000">
          🌍 <strong>Legado em 2026:</strong> ${m.legado}
        </div>
      `;
    };
  });
}

function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">
      ${a.demo.componentes.map((c,i)=>`<button class="btn" data-i="${i}" style="background:#4e342e">${c.nome}</button>`).join('')}
    </div>
    <div id="ab6-reveal" style="margin-top:14px;padding:14px;border-radius:8px;background:#efebe9;min-height:120px;border-left:5px solid var(--cor)">
      <em>👆 Clique em um componente para ver seu papel e como o SO interage com ele.</em>
    </div>
  `;
  area.appendChild(wrap);
  wrap.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const c = a.demo.componentes[+b.dataset.i];
      document.getElementById('ab6-reveal').innerHTML = `
        <strong>${c.nome}</strong><br><br>
        ⚙️ <strong>Papel:</strong> ${c.papel}<br><br>
        <div style="padding:10px;background:#e8f5e9;border-radius:6px;border-left:4px solid var(--ok)">
          🐧 <strong>Como o SO interage:</strong> ${c.so}
        </div>
      `;
    };
  });
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  if(estado.demos[abaId] && estado.demos[abaId].parar) estado.demos[abaId].parar();
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
</body>
</html>
