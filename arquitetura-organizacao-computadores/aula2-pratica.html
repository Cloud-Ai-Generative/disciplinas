            {t:"Von Neumann pura sem caches",c:0,fb:"Se há caches separadas, não é 'sem caches'. E a separação é justamente o traço Harvard (modificada)."},
            {t:"Arquitetura dataflow",c:0,fb:"Dataflow muda o modelo de execução (sem PC sequencial). Caches separadas não implicam dataflow."}
          ]}
      ]
    }
  ],
  revisao:{
    titulo:"Revisão — Mapa completo e Chefão",
    cola:[
      "• E/S = fronteira com o mundo: entrada, saída e mistos (touchscreen, SSD, rede)",
      "• Velocidades: teclado ~10 B/s ↔ SSD NVMe ~7 GB/s ↔ rede 100GbE ~12,5 GB/s",
      "• Controle de E/S: programada (busy-wait) → interrupção → DMA (CPU livre)",
      "• Controlador = hardware; driver = software que o comanda",
      "• Von Neumann (1945, EDVAC): programa armazenado na MESMA memória que dados",
      "• Componentes: memória + UC + ULA (CPU) + E/S, ligados por barramentos",
      "• PC aponta próxima instrução; ciclo buscar → decodificar → executar",
      "• Gargalo de Von Neumann: barramento único CPU↔memória; memory wall",
      "• RAM ~60-100 ns vs registrador <1 ns = centenas de ciclos ociosos",
      "• Mitigações: caches L1/L2/L3, prefetch, barramentos largos, localidade",
      "• Impacto: indústria de software, OTA, App Stores — e também malware",

  localStorage.setItem('arqcomp_aula02',JSON.stringify({

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');

}

  if(/gargalo|memory wall|cache|localidade/.test(lower)) pontos++;
  if(/h[íi]brido|von neumann/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){

    fb.innerHTML=`✅ <strong>Excelente!</strong> Você cobriu ${pontos}/5 pontos. Ganhou 50 XP e o selo "Arquiteto de IoT".`;

}

/* ABA 2 — Simulador de modos de E/S */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  const TOTAL = 12;
  const modos = {
    programada:{rotulo:"🐢 E/S programada (busy-wait)",ocupados:Array.from({length:TOTAL},(_,i)=>i),
      desc:"CPU consulta o status e copia byte a byte. Ocupada em TODOS os ticks."},
    interrupcao:{rotulo:"⚡ Dirigida por interrupção",ocupados:[0,1,6,7,10,11],
      desc:"CPU trabalha só nos eventos (início, meio, fim). Nos demais ticks, o dispositivo age sozinho."},
    dma:{rotulo:"🚀 DMA",ocupados:[0,1,11],
      desc:"CPU configura (ticks 0-1), o controlador DMA transfere sozinho e a CPU só é interrompida no fim (tick 11)."}
  };
  let timer = null;
  function parar(){ if(timer){clearInterval(timer);timer=null;} }
  function desenha(logTexto, tick, modoKey){
    const m = modos[modoKey||'programada'];
    const ocupadoAgora = modoKey ? (m.ocupados.includes(tick) ? 100 : 0) : 0;
    const ocupadosAte = modoKey ? m.ocupados.filter(x=>x<=tick).length : 0;
    const pct = modoKey && tick>=0 ? Math.round(ocupadosAte/(tick+1)*100) : 0;
    wrap.innerHTML = `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${Object.keys(modos).map(k=>`<button class="btn" data-m="${k}" style="background:${modoKey===k?'var(--cor)':'#6c757d'}">${modos[k].rotulo}</button>`).join('')}
      </div>
      <div style="padding:12px;background:#fff;border-radius:8px;border:1px solid var(--borda)">
        <strong>Ocupação da CPU no tick ${Math.max(tick,0)}/${TOTAL-1}:</strong>
        <div class="cpu-bar"><div style="width:${ocupadoAgora}%"></div></div>
        <div style="font-size:.9rem;color:var(--muted)">${modoKey?modos[modoKey].desc:'Escolha um modo e clique em Transferir.'}</div>
        <div style="margin-top:8px;font-size:.95rem">Ocupação média até agora: <strong>${pct}%</strong></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="ab2-run">📦 Transferir 1 MB</button>
        <button class="btn sec" id="ab2-stop">⏹ Parar</button>
      </div>
      <div class="console" id="ab2-log" style="background:#0f172a;color:#7dd3fc;padding:10px;border-radius:8px;font-family:'Courier New',monospace;font-size:.88rem;white-space:pre-wrap;min-height:90px;margin-top:10px">${logTexto||'Aguardando transferência...'}</div>
    `;
    wrap.querySelectorAll('[data-m]').forEach(b=>{
      b.onclick=()=>{ parar(); desenha('Modo selecionado. Clique em Transferir 1 MB.', -1, b.dataset.m); estado.demos.aba2 = {parar, modoSel:b.dataset.m}; };
    });
    wrap.querySelector('#ab2-stop').onclick=()=>{ parar(); };
    wrap.querySelector('#ab2-run').onclick=()=>{
      parar();
      const mk = (estado.demos.aba2 && estado.demos.aba2.modoSel) || 'programada';
      let t = -1;
      let log = `Iniciando transferência de 1 MB via ${modos[mk].rotulo}...\n`;
      timer = setInterval(()=>{
        t++;
        const oc = modos[mk].ocupados.includes(t);
        log += `tick ${String(t).padStart(2,'0')}: CPU ${oc?'OCUPADA movendo dados':'livre (dispositivo/controlador trabalha)'}\n`;
        desenha(log, t, mk);
        if(t>=TOTAL-1){
          parar();
          const ocup = modos[mk].ocupados.length;
          const fim = `\n✅ Concluído. CPU ocupada em ${ocup}/${TOTAL} ticks (${Math.round(ocup/TOTAL*100)}%).\n` +
            (mk==='programada' ? '⚠️ Exemplo real: copiar 1 GB assim travaria um núcleo em 100%.' :
             mk==='interrupcao' ? '💡 Usado por teclado/mouse: eventos raros, CPU quase livre.' :
             '💡 Usado por SSDs NVMe e redes: CPU só configura e finaliza.');
          desenha(log+fim, TOTAL-1, mk);
        }
      },450);
    };
  }
  area.appendChild(wrap);
  desenha('', -1, null);
  estado.demos.aba2 = {parar};
}

    `;
    wrap.querySelector('#ab3-next').onclick = passo;
    wrap.querySelector('#ab3-reset').onclick = ()=>{ reset(); desenha(); };
  }
  function passo(){
    s.hl = {};
    if(s.halt){ desenha(); return; }
    const inst = prog[s.pc];
    if(s.fase===0){ // BUSCAR
      s.mar = s.pc; s.hl.pc=true; s.hl.mar=true; s.hl['m'+s.pc]=true;
      s.mdr = inst.txt; s.hl.mdr=true;
      s.ir = inst.txt; s.hl.ir=true;
      s.log = `PC(${s.pc}) → MAR; memória[${s.pc}] → MDR → IR. Instrução buscada: ${inst.txt}`;
      s.fase=1;
    } else if(s.fase===1){ // DECODIFICAR
      s.hl.ir=true;
      s.log = `UC decodifica IR: "${inst.txt}". Prepara operandos e a ULA se necessário.`;
      s.fase=2;
    } else { // EXECUTAR
      const msg = inst.efeito(s);
      s.hl.R1=true;
      if(inst.txt.startsWith('LOAD')) s.hl.m20=true;
      if(inst.txt.startsWith('STORE')) s.hl.m21=true;
      s.log = msg;
      s.pc++;
      s.fase=0;
      if(s.halt){ s.log += ' (HALT)'; }
    }
    desenha();
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 4 — Memory wall */
function renderDemoAba4(area,a){
  const wrap = document.createElement('div');
  const st = {ghz:5, ns:100, cache:true};
  function desenha(){
    const ciclosEspera = st.ghz * st.ns; // ciclos = GHz * ns
    const semCache = Math.round(ciclosEspera/(ciclosEspera+1)*100);
    const efetivo = st.cache ? (0.05*ciclosEspera + 0.95*1) : ciclosEspera;
    const comCache = Math.round(efetivo/(efetivo+1)*100);
    wrap.innerHTML = `
      <div class="slider-group" style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:8px 0">
        <label>⚙️ Frequência da CPU: <strong>${st.ghz.toFixed(1)} GHz</strong></label>
        <input type="range" id="ab4-g" min="1" max="6" step="0.5" value="${st.ghz}">
      </div>
      <div class="slider-group" style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:8px 0">
        <label>🐌 Latência da RAM: <strong>${st.ns} ns</strong></label>
        <input type="range" id="ab4-n" min="10" max="120" step="5" value="${st.ns}">
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin:8px 0">
        <input type="checkbox" id="ab4-c" ${st.cache?'checked':''} style="width:20px;height:20px">
        <strong>Com caches L1/L2/L3 (95% de acertos)</strong>
      </label>
      <div style="padding:14px;background:var(--cor-suave);border-radius:8px;border:2px solid var(--cor)">
        <div style="font-size:1.05rem">Ciclos ociosos POR ACESSO à RAM: <strong>${Math.round(ciclosEspera)}</strong></div>
        <div style="margin-top:6px">Tempo perdido sem cache: <strong>${semCache}%</strong></div>
        <div class="cpu-bar"><div style="width:${semCache}%;background:#c62828"></div></div>
        <div style="margin-top:6px">Tempo perdido com cache: <strong>${comCache}%</strong></div>
        <div class="cpu-bar"><div style="width:${comCache}%;background:#2e7d32"></div></div>
        <div style="margin-top:10px;padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000;font-size:.92rem">
          💡 ${semCache>80?'Sem cache, a CPU passa a maior parte do tempo ESPERANDO a memória: é o memory wall em ação.':
             semCache>50?'Metade do tempo da CPU se perde esperando a RAM. Caches e prefetch são obrigatórios.':
             'Com RAM rápida e CPU modesta, o gargalo aperta menos — mas ainda existe.'}
          ${st.cache?' Com cache, ~95% dos acessos param na L1 (~1 ciclo) e o desperdício despenca.':''}
        </div>
      </div>
    `;
    wrap.querySelector('#ab4-g').oninput=e=>{st.ghz=+e.target.value;desenha();};
    wrap.querySelector('#ab4-n').oninput=e=>{st.ns=+e.target.value;desenha();};
    wrap.querySelector('#ab4-c').onchange=e=>{st.cache=e.target.checked;desenha();};
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 5 — Marcos de impacto */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">
      ${a.demo.marcos.map((m,i)=>`<button class="btn" data-i="${i}" style="background:#455a64">${m.ano} — ${m.nome}</button>`).join('')}
    </div>
    <div id="ab5-reveal" style="margin-top:14px;padding:14px;border-radius:8px;background:#eceff1;min-height:100px;border-left:5px solid var(--cor)">
      <em>👆 Clique em um marco para ver o impacto do princípio de Von Neumann.</em>
    </div>
  `;
  area.appendChild(wrap);
  wrap.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const m = a.demo.marcos[+b.dataset.i];
      document.getElementById('ab5-reveal').innerHTML = `
        <strong>${m.ano} — ${m.nome}</strong><br><br>
        🌍 <strong>Impacto:</strong> ${m.impacto}
      `;
    };
  });
}

/* ABA 6 — Diagnóstico de arquiteturas */
function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  let atual = 0;
  function desenha(){
    if(atual>=a.demo.cenarios.length){
      wrap.innerHTML = `
        <div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">
          ✅ <strong>Diagnóstico completo!</strong> Você identificou Harvard pura (AVR/DSP), Harvard modificada (caches de CPU), neuromórfica (TrueNorth/Loihi) e Harvard em DSP de áudio.<br><br>
          💡 <strong>Lição:</strong> o computador moderno é HÍBRIDO — Von Neumann no nível lógico, Harvard nas caches, DMA na E/S e aceleradores ao lado.
        </div>`;
      return;
    }
    const c = a.demo.cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>Caso ${atual+1}/${a.demo.cenarios.length}:</strong><br><br>${c.pergunta}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${c.opcoes.map((o,i)=>`<button class="alt" data-i="${i}">${o.t}</button>`).join('')}
      </div>
      <div id="ab6-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('.alt').forEach(btn=>{
      btn.onclick=()=>{
        const o = c.opcoes[+btn.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb;
        if(o.c){
          fb.innerHTML += '<br><button class="btn" style="margin-top:8px">Próximo caso →</button>';
          wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          btn.disabled = true;
          fb.innerHTML += '<br><em>🔁 As outras opções continuam disponíveis. Tente de novo!</em>';
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  if(estado.demos[abaId] && estado.demos[abaId].parar) estado.demos[abaId].parar();
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
