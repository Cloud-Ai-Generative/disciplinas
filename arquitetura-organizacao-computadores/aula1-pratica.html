<style>
:root{

}
*{box-sizing:border-box}
body.dark{

html,body{margin:0;padding:0;background:var(--fundo);color:var(--texto);font-family:var(--fonte);font-size:var(--tam);line-height:1.55}
header.topo{

}
header.topo h1{font-size:1.1rem;margin:0;font-weight:700}
header.topo .meta{font-size:.85rem;opacity:.95}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.acoes button{
  background:#fff;color:var(--cor);border:none;padding:6px 10px;border-radius:6px;
  cursor:pointer;font-weight:600;font-size:.85rem
}
.acoes button:hover{background:var(--cor-suave)}
nav.tabs{
  position:sticky;top:56px;z-index:90;background:var(--painel);
  border-bottom:2px solid var(--borda);overflow-x:auto;white-space:nowrap;
  scrollbar-width:thin
}
nav.tabs button{
  font-family:var(--fonte);font-size:var(--tam);background:transparent;color:var(--texto);
  border:none;padding:12px 16px;cursor:pointer;border-bottom:4px solid transparent;
  margin:0;font-weight:600;opacity:.75
}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-selected="true"]{
  color:var(--cor);border-bottom-color:var(--cor);opacity:1;
  background:var(--painel);
}
nav.tabs button .selo{font-size:.7rem;background:var(--cor);color:#fff;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
main{max-width:980px;margin:0 auto;padding:20px}
section.aba{display:none;animation:fade .3s ease}
section.aba.ativa{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--painel);border:2px solid var(--borda);border-radius:12px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{margin-top:0;color:var(--cor);font-size:1.3rem;border-bottom:2px dashed var(--borda);padding-bottom:6px}
.missao{
  background:linear-gradient(135deg,var(--cor),var(--cor-forte));color:#fff;

}
.missao strong{display:block;font-size:1.1rem;margin-bottom:4px}
.demo{
  background:var(--suave2, #eef5ff);border:2px solid var(--cor);border-radius:10px;
  padding:16px;margin:18px 0
}
body.dark .demo{background:#0d2744}
.demo h3{color:var(--cor);margin-top:0}
.instru{

}
body.dark .instru{background:#3a2d10}
.preveja{
  background:#e8f5e9;border-left:5px solid var(--ok);padding:10px 14px;border-radius:6px;

}
body.dark .preveja{background:#1e3a1e}
.obs{
  background:#e3f2fd;border-left:5px solid #1976d2;padding:10px 14px;border-radius:6px;margin:10px 0;font-size:.95rem
}
body.dark .obs{background:#153047}
button.btn{

  cursor:pointer;font-weight:600;font-family:var(--fonte);font-size:.95rem;margin:4px 4px 4px 0
}
button.btn:hover{filter:brightness(1.08)}
button.btn.sec{background:#6c757d}
button.btn:disabled{opacity:.5;cursor:not-allowed}

.quiz-perg h4{margin:0 0 10px;color:var(--texto)}
.quiz-perg .alts{display:flex;flex-direction:column;gap:8px}
.alt{

  padding:10px 14px;cursor:pointer;font-family:var(--fonte);font-size:1rem;
  transition:all .2s
}
.alt:hover:not(:disabled){border-color:var(--cor);background:var(--cor-suave)}
.alt:disabled{cursor:not-allowed;opacity:.85}

.alt.errada{background:#f8d7da;border-color:var(--erro);color:#721c24}

.fb.ok{background:#d4edda;border-left:5px solid var(--ok);color:#155724;display:block}
.fb.bad{background:#f8d7da;border-left:5px solid var(--erro);color:#721c24;display:block}
body.dark .fb.ok{background:#1e3a1e;color:#a8e6a8}
body.dark .fb.bad{background:#3a1e1e;color:#ffb3b3}
details{background:var(--suave2,#fafafa);border:1px solid var(--borda);border-radius:8px;padding:8px 12px;margin:10px 0}
body.dark details{background:#222}
details summary{cursor:pointer;font-weight:600;color:var(--cor)}
details[open] summary{margin-bottom:8px}
details.lex{background:#fff3e0;border-color:#ffb74d}
details.links{background:#e8f5e9;border-color:#81c784}
details.links a{color:var(--cor);font-weight:600}
.progresso{
  background:var(--painel);border:2px solid var(--borda);border-radius:10px;
  padding:10px 14px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.95rem

.xp{background:var(--cor);color:#fff;padding:3px 10px;border-radius:20px;font-weight:700}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo-chip{background:var(--cor-suave);color:var(--cor);padding:3px 8px;border-radius:20px;font-size:.8rem;font-weight:600}
.rota{
  background:#e0f7fa;border-left:5px solid #0097a7;padding:10px 14px;border-radius:6px;
  margin:10px 0;font-size:.9rem
}
body.dark .rota{background:#0c2d33;color:#b3e5fc}
body.apresentacao{font-size:22px}
body.apresentacao nav.tabs button{font-size:22px}
body.apresentacao .rota-apres{
  position:fixed;bottom:0;left:0;right:0;background:#263238;color:#fff;
  padding:14px 20px;font-size:1.05rem;box-shadow:0 -2px 8px rgba(0,0,0,.25);z-index:50
}
.revisao-mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.revisao-mapa .no{
  border:2px solid var(--cor);border-radius:8px;padding:10px;background:var(--cor-suave)
}
.revisao-mapa .no strong{color:var(--cor)}
.cola{background:#fff3cd;border-left:5px solid #ffc107;padding:12px 16px;border-radius:8px;font-family:"Courier New",monospace;font-size:.95rem;white-space:pre-wrap}
body.dark .cola{background:#3a2d10;color:#ffd980}
.chefao{
  background:linear-gradient(135deg,#263238,#37474f);color:#fff;padding:18px;border-radius:12px;margin-top:18px

.chefao h3{color:#ffd54f;margin-top:0}
.chefao button{background:#ffd54f;color:#263238}
.cpu-box{

  background:#fff;border:2px solid var(--cor);min-width:80px;text-align:center
}
.cpu-box.active{background:var(--cor);color:#fff;transform:scale(1.1);transition:all .2s}
.mem-cell{
  display:inline-block;width:42px;height:42px;background:#fff;border:2px solid #ccc;
  text-align:center;line-height:42px;font-family:monospace;margin:2px;font-size:.85rem
}
.mem-cell.hl{background:#ffeb3b;border-color:#f57f17;font-weight:700}
.mem-cell.data{background:#c8e6c9;border-color:#388e3c}
.mem-cell.inst{background:#bbdefb;border-color:#1976d2}
footer{max-width:980px;margin:30px auto;padding:20px;text-align:center;color:var(--muted);font-size:.85rem}
@media(max-width:600px){
  main{padding:12px}
  .card{padding:14px}
  header.topo h1{font-size:.95rem}
  .mem-cell{width:34px;height:34px;line-height:34px;font-size:.75rem}
}
</style>

    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('arqcomp_aula01',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;

function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

    };
    nav.appendChild(btn);

}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map(alt=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}
function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}
function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));
  }
}
function marcarDemoOk(abaId){
  if(!estado.demoOk.has(abaId)){
    estado.demoOk.add(abaId);
    ganhaXP(5,'Demo concluída');
    verificarAbaCompleta(abaId);
    salvarEstado();
    const area = document.querySelector(`#demo-${abaId}`);
    if(area){
      area.querySelectorAll('button.btn').forEach(b=>{
        if(b.textContent.includes('Concluí')){

          span.className='selo-chip';

}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<120){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Desenvolva os 4 níveis da hierarquia.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/registrador|cache|l1|l2|localidade/.test(lower)) pontos++;
  if(/\bram\b|thrashing|p[áa]gina|mem[óo]ria principal/.test(lower)) pontos++;
  if(/ssd|hdd|disco|i\/o|lat[êe]ncia|banco/.test(lower)) pontos++;
  if(/pipeline|stall|ciclo|cpu|ula|uc/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=3){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Excelente!</strong> Você cobriu ${pontos}/4 níveis. Ganhou 50 XP e o selo "Arquiteto de Performance".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Arquiteto de Performance');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/4 níveis. Reveja: registradores/cache, RAM, SSD/I/O, pipeline da CPU.`;
  }
}

function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  const inst = ["ADD R1,R2","MOV R3,#5","SUB R4,R1","JMP 100","CMP R2,R3"];
  const estagios = a.demo.estagios;
  let ciclo = 0;
  let timer = null;
  function parar(){if(timer){clearInterval(timer);timer=null;}}
  function desenha(){
    const totalCiclos = inst.length + estagios.length - 1;
    let html = `
      <div style="overflow-x:auto;padding:10px;background:#fff;border-radius:8px;border:2px solid var(--cor)">
        <table style="border-collapse:collapse;width:100%;min-width:400px">
          <tr><th style="padding:6px;text-align:left">Instrução</th>
          ${estagios.map(e=>`<th style="padding:6px;text-align:center;font-size:.85rem">${e}</th>`).join('')}</tr>
    `;
    for(let i=0;i<inst.length;i++){
      html += `<tr><td style="padding:6px;font-family:monospace;font-weight:700;border-top:1px solid #eee">${inst[i]}</td>`;
      for(let j=0;j<estagios.length;j++){
        const cicloAtivo = ciclo - i;
        const emExec = cicloAtivo===j && cicloAtivo>=0;
        const feito = cicloAtivo>j && cicloAtivo>=0;
        const cor = emExec?'#1976d2':(feito?'#81c784':'#f5f5f5');
        const texto = emExec?'⚡':(feito?'✓':'');
        html += `<td style="padding:6px;text-align:center;background:${cor};color:#fff;border-top:1px solid #eee">${texto}</td>`;
      }
      html += '</tr>';
    }
    html += '</table></div>';
    html += `
      <div style="margin-top:10px;padding:10px;background:#e3f2fd;border-radius:6px">
        <strong>Ciclo: ${ciclo}/${totalCiclos}</strong> — 
        ${ciclo<estagios.length?'⏳ Pipeline enchendo...':(ciclo<=inst.length?'✅ Pipeline cheio — 1 instrução concluída por ciclo!':'⏳ Pipeline esvaziando...')}
      </div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" id="ab5-step">▶ Avançar 1 ciclo</button>
        <button class="btn sec" id="ab5-auto">${timer?'⏸ Pausar':'⏩ Auto'}</button>
        <button class="btn sec" id="ab5-reset">🔄 Reset</button>
      </div>
    `;
    wrap.innerHTML = html;
    wrap.querySelector('#ab5-step').onclick=()=>{if(ciclo<totalCiclos) ciclo++; desenha();};
    wrap.querySelector('#ab5-auto').onclick=()=>{
      if(timer){parar();}
      else{
        timer = setInterval(()=>{
          if(ciclo>=totalCiclos){parar();}
          else{ciclo++;}
          desenha();
        },700);
      }
      desenha();
    };
    wrap.querySelector('#ab5-reset').onclick=()=>{parar();ciclo=0;desenha();};
  }
  area.appendChild(wrap);
  desenha();
  estado.demos.aba5 = {parar};
}

  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
</body>
