      teoria:[
        "O <strong>COCOMO (Constructive Cost Model)</strong> foi criado por <strong>Barry Boehm</strong> em 1981, baseado em dados de 63 projetos da indústria. É um modelo <strong>algorítmico</strong>: usa fórmulas matemáticas para estimar esforço, tempo e custo.",
        "A fórmula básica é: <strong>Esforço (PM) = a × (KSLOC)^b × Fatores</strong>. PM = Person-Months (homem-mês); KSLOC = milhares de linhas de código (excluindo comentários).",
        "<strong>Três níveis do COCOMO</strong>:",

const estado = {xp:0,selos:new Set(),quizOk:new Set(),demoOk:new Set(),dark:false,apres:false,abaAtiva:null,demos:{}};

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('devops_aula02')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('devops_aula02',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}
function renderTabs(){
  const nav = document.getElementById('tablist');
  nav.innerHTML = '';
  const todas = [...AULA_DADOS.abas,{id:'revisao',titulo:'Revisão'}];
  todas.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.setAttribute('aria-selected','false');
    btn.setAttribute('aria-controls',a.id);
    btn.dataset.id = a.id;
    btn.innerHTML = `${i+1}. ${a.titulo}${a.estudoProprio?'<span class="selo">📖 Estudo próprio</span>':''}`;
    btn.onclick = ()=>irPara(a.id);
    btn.onkeydown = (e)=>{
      if(e.key==='ArrowRight'){const next = btn.nextElementSibling||nav.firstElementChild; next.focus();}
      else if(e.key==='ArrowLeft'){const prev = btn.previousElementSibling||nav.lastElementChild; prev.focus();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();irPara(a.id);}
    };
    nav.appendChild(btn);
  });
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map(alt=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}
function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}
function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));
  }
}
function marcarDemoOk(abaId){
  if(!estado.demoOk.has(abaId)){
    estado.demoOk.add(abaId);
    ganhaXP(5,'Demo concluída');
    verificarAbaCompleta(abaId);
    salvarEstado();
    const area = document.querySelector(`#demo-${abaId}`);
    if(area){
      area.querySelectorAll('button.btn').forEach(b=>{
        if(b.textContent.includes('Concluí')){
          const span = document.createElement('span');
          span.className='selo-chip';
          span.textContent='✓ Demo concluída';
          b.replaceWith(span);
        }
      });
    }
  }
}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<160){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Desenvolva as 5 frentes.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/pontos? de fun[çc][ãa]o|ifpug|apf|sisp/.test(lower)) pontos++;
  if(/planning poker|story points?|velocity|scrum|sprint/.test(lower)) pontos++;
  if(/cocomo|cone.{1,5}incerteza|buffer|faixa|risk/.test(lower)) pontos++;
  if(/dora|lead time|mttr|deploy freq|change fail/.test(lower)) pontos++;
  if(/ita[úu]|nubank|banco do brasil|bb|bradesco|caixa|governo/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Excelente!</strong> Você cobriu ${pontos}/5 frentes. Ganhou 50 XP e o selo "CTO de Fintech".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('CTO de Fintech');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/5 frentes. Reveja: PF para contratação, velocity para squads, COCOMO+cone para board, DORA para governança, exemplo brasileiro.`;
  }
}

          ✅ <strong>Você classificou todas as ${a.demo.metricas.length} métricas!</strong><br><br>
          🎯 <strong>Acertos:</strong> ${estadoLocal.acertos}/${a.demo.metricas.length}<br><br>
          💡 <strong>Insight final:</strong> A maioria das métricas DevOps modernas (DORA) é de PROCESSO. A indústria descobriu que processo eficiente é melhor indicador que métricas de produto em tempo real.
        </div>`;
      return;
    }
    const m = a.demo.metricas[estadoLocal.atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px;text-align:center">
        <div style="font-size:.85rem;color:var(--muted)">Métrica ${estadoLocal.atual+1} de ${a.demo.metricas.length}</div>
        <div style="font-size:1.4rem;font-weight:700;margin:10px 0;color:var(--cor)">${m.nome}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-tipo="produto" style="background:#1976d2">📦 Produto</button>
        <button class="btn" data-tipo="processo" style="background:#388e3c">⚙️ Processo</button>
        <button class="btn" data-tipo="projeto" style="background:#f57c00">📊 Projeto</button>
      </div>
      <div id="ab2-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('[data-tipo]').forEach(btn=>{
      btn.onclick = ()=>{
        const escolha = btn.dataset.tipo;
        const correto = escolha === m.tipo;
        const fb = document.createElement('div');
        fb.className = 'fb '+(correto?'ok':'bad');
        if(correto){
          estadoLocal.acertos++;
          fb.innerHTML = `✅ <strong>Correto!</strong> ${m.nome} é métrica de ${m.tipo.toUpperCase()}.<br>💡 ${m.exemplo}<br><button class="btn" style="margin-top:8px">Próxima métrica →</button>`;
          wrap.querySelectorAll('[data-tipo]').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{estadoLocal.atual++;desenha();};
        } else {
          fb.innerHTML = `❌ <strong>Incorreto.</strong> ${m.nome} é métrica de <strong>${m.tipo}</strong>, não ${escolho}.<br>💡 ${m.exemplo}<br><em>🔁 Tente outra categoria.</em>`;
          btn.disabled = true;
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 4 — Calculadora COCOMO */
function renderDemoAba4(area,a){
  const wrap = document.createElement('div');
  const estadoLocal = {ksloc:10, modo:'organico'};
  const parametros = {
    organico:{a:2.4,b:1.05,t_a:2.5,t_b:0.38,nome:'Orgânico',desc:'Projetos simples, times pequenos, requisitos flexíveis'},
    semi:{a:3.0,b:1.12,t_a:2.5,t_b:0.35,nome:'Semi-Detachado',desc:'Projetos médios, experiência mista, requisitos parcialmente conhecidos'},
    embutido:{a:3.6,b:1.20,t_a:2.5,t_b:0.32,nome:'Embutido',desc:'Projetos complexos, restrições rígidas, tempo real, hardware específico'}
  };
  const salarioMensal = 12000; // R$/mês por dev
  function atualiza(){
    const p = parametros[estadoLocal.modo];
    const esforco = p.a * Math.pow(estadoLocal.ksloc, p.b);
    const tempo = p.t_a * Math.pow(esforco, p.t_b);
    const devs = esforco / tempo;
    const custo = esforco * salarioMensal;
    wrap.innerHTML = `
      <div class="slider-group">
        <label>📏 Tamanho do projeto: <strong>${estadoLocal.ksloc} KSLOC</strong> (${(estadoLocal.ksloc*1000).toLocaleString('pt-BR')} linhas de código)</label>
        <input type="range" id="ab4-ksloc" min="1" max="500" step="1" value="${estadoLocal.ksloc}">
      </div>
      <div class="slider-group">
        <label>🎯 Modo do projeto:</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
          ${Object.keys(parametros).map(k=>`<button class="btn" data-modo="${k}" style="background:${k===estadoLocal.modo?'var(--cor)':'#6c757d'}">${parametros[k].nome}</button>`).join('')}
        </div>
        <div style="font-size:.85rem;color:var(--muted);margin-top:6px">${p.desc}</div>
      </div>
      <div style="padding:14px;background:var(--cor-suave);border-radius:8px;border:2px solid var(--cor);margin-top:10px">
        <strong style="font-size:1.1rem">📊 Estimativas COCOMO</strong>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px">
          <div class="kpi-card"><div class="valor">${esforco.toFixed(1)}</div><div class="rotulo">Esforço (PM)</div></div>
          <div class="kpi-card"><div class="valor">${tempo.toFixed(1)}</div><div class="rotulo">Tempo (meses)</div></div>
          <div class="kpi-card"><div class="valor">${devs.toFixed(1)}</div><div class="rotulo">Pessoas necessárias</div></div>
          <div class="kpi-card"><div class="valor">R$ ${(custo/1000).toFixed(0)}K</div><div class="rotulo">Custo estimado</div></div>
        </div>
        <div style="margin-top:12px;padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000;font-family:'Courier New',monospace;font-size:.9rem">
          <strong>Fórmula aplicada:</strong><br>
          Esforço = ${p.a} × (${estadoLocal.ksloc})^${p.b} = <strong>${esforco.toFixed(2)} PM</strong><br>
          Tempo = ${p.t_a} × (${esforco.toFixed(2)})^${p.t_b} = <strong>${tempo.toFixed(2)} meses</strong><br>
          Equipe = ${esforco.toFixed(2)} ÷ ${tempo.toFixed(2)} = <strong>${devs.toFixed(2)} pessoas</strong>
        </div>
        <div style="margin-top:10px;font-size:.85rem;color:var(--muted)">
          💡 <em>Custo calculado com salário médio de R$ ${salarioMensal.toLocaleString('pt-BR')}/mês por desenvolvedor (referência Brasil 2026).</em>
        </div>
      </div>
    `;
    wrap.querySelector('#ab4-ksloc').oninput = (e)=>{ estadoLocal.ksloc = +e.target.value; atualiza(); };
    wrap.querySelectorAll('[data-modo]').forEach(b=>{
      b.onclick = ()=>{ estadoLocal.modo = b.dataset.modo; atualiza(); };
    });
  }
  area.appendChild(wrap);
  atualiza();
}

/* ABA 5 — Contador de Pontos de Função */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  const componentes = {
    EE:{nome:'Entrada Externa',desc:'Dados que entram (formulários, APIs)',pts:{baixa:3,media:4,alta:6}},
    SE:{nome:'Saída Externa',desc:'Relatórios, cálculos processados',pts:{baixa:4,media:5,alta:7}},
    CE:{nome:'Consulta Externa',desc:'Recupera dados sem processamento',pts:{baixa:3,media:4,alta:6}},
    ALI:{nome:'Arquivo Lógico Interno',desc:'Dados mantidos internamente',pts:{baixa:7,media:10,alta:15}},
    AIE:{nome:'Arquivo de Interface Externa',desc:'Dados de outro sistema',pts:{baixa:5,media:7,alta:10}}
  };
  const estadoLocal = {};
  Object.keys(componentes).forEach(k=>{
    estadoLocal[k] = {baixa:0,media:0,alta:0};
  });
  const precoPF = 900; // R$ por PF (referência SISP)
  function calcular(){
    let total = 0;
    Object.keys(componentes).forEach(k=>{
      const c = componentes[k];
      total += estadoLocal[k].baixa * c.pts.baixa;
      total += estadoLocal[k].media * c.pts.media;
      total += estadoLocal[k].alta * c.pts.alta;
    });
    return total;
  }
  function desenha(){
    const total = calcular();
    const custo = total * precoPF;
    let html = `
      <div style="padding:10px;background:#ede7f6;border-radius:8px;margin-bottom:12px">
        <strong>📋 Adicione componentes funcionais:</strong>
      </div>
      <div style="padding:12px;background:#fff;border-radius:8px;border:1px solid var(--borda)">
        <div class="pf-row header">
          <div>Componente</div><div>Baixa</div><div>Média / Alta</div>
        </div>
    `;
    Object.keys(componentes).forEach(k=>{
      const c = componentes[k];
      html += `
        <div class="pf-row">
          <div>
            <strong style="color:var(--cor)">${k}</strong> — ${c.nome}<br>
            <small style="color:var(--muted)">${c.desc} | ${c.pts.baixa}/${c.pts.media}/${c.pts.alta} pts</small>
          </div>
          <div style="display:flex;gap:4px;align-items:center">
            <button class="btn sec" data-k="${k}" data-c="baixa" data-d="-1" style="padding:4px 8px">−</button>
            <span style="min-width:20px;text-align:center;font-weight:700">${estadoLocal[k].baixa}</span>
            <button class="btn" data-k="${k}" data-c="baixa" data-d="1" style="padding:4px 8px">+</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div style="display:flex;gap:4px;align-items:center">
              <button class="btn sec" data-k="${k}" data-c="media" data-d="-1" style="padding:4px 8px">−</button>
              <span style="min-width:20px;text-align:center;font-weight:700">${estadoLocal[k].media}</span>
              <button class="btn" data-k="${k}" data-c="media" data-d="1" style="padding:4px 8px">+</button>
              <small>M</small>
            </div>
            <div style="display:flex;gap:4px;align-items:center">
              <button class="btn sec" data-k="${k}" data-c="alta" data-d="-1" style="padding:4px 8px">−</button>
              <span style="min-width:20px;text-align:center;font-weight:700">${estadoLocal[k].alta}</span>
              <button class="btn" data-k="${k}" data-c="alta" data-d="1" style="padding:4px 8px">+</button>
              <small>A</small>
            </div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    html += `
      <div style="padding:14px;background:var(--cor-suave);border-radius:8px;border:2px solid var(--cor);margin-top:12px">
        <strong style="font-size:1.2rem">📊 Contagem de Pontos de Função</strong>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px">
          <div class="kpi-card"><div class="valor">${total}</div><div class="rotulo">PF Totais</div></div>
          <div class="kpi-card"><div class="valor">R$ ${(custo/1000).toFixed(1)}K</div><div class="rotulo">Custo estimado</div></div>
          <div class="kpi-card"><div class="valor">${(total*8).toFixed(0)}</div><div class="rotulo">Horas estimadas*</div></div>
          <div class="kpi-card"><div class="valor">${(total*8/160).toFixed(1)}</div><div class="rotulo">PMs (homem-mês)</div></div>
        </div>
        <div style="margin-top:12px;padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000;font-size:.9rem">
          💡 <em>* Estimativa de 8 horas por PF (produtividade média brasileira). Custo calculado a R$ ${precoPF}/PF (referência SISP 2026).</em>
        </div>
        <button class="btn sec" id="ab5-reset" style="margin-top:8px">🔄 Zerar contagem</button>
        <button class="btn" id="ab5-exemplo" style="margin-top:8px">📝 Carregar exemplo (e-commerce)</button>
      </div>
    `;
    wrap.innerHTML = html;
    wrap.querySelectorAll('[data-k]').forEach(btn=>{
      btn.onclick = ()=>{
        const k = btn.dataset.k;
        const c = btn.dataset.c;
        const d = +btn.dataset.d;
        estadoLocal[k][c] = Math.max(0, estadoLocal[k][c] + d);
        desenha();
      };
    });
    wrap.querySelector('#ab5-reset').onclick = ()=>{
      Object.keys(componentes).forEach(k=>{
        estadoLocal[k] = {baixa:0,media:0,alta:0};
      });
      desenha();
    };
    wrap.querySelector('#ab5-exemplo').onclick = ()=>{
      // Exemplo: sistema de e-commerce pequeno
      estadoLocal.EE = {baixa:3,media:5,alta:2}; // cadastros, pedidos
      estadoLocal.SE = {baixa:2,media:4,alta:3}; // relatórios
      estadoLocal.CE = {baixa:5,media:3,alta:1}; // buscas
      estadoLocal.ALI = {baixa:2,media:3,alta:2}; // clientes, produtos, pedidos
      estadoLocal.AIE = {baixa:1,media:2,alta:0}; // CEP, gateway pagamento
      desenha();
    };
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 6 — Cenários de escolha */
function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  let atual = 0;
  let acertos = 0;
  function desenha(){
    if(atual >= a.demo.cenarios.length){
      wrap.innerHTML = `
        <div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">
          ✅ <strong>Você resolveu todos os ${a.demo.cenarios.length} cenários!</strong><br><br>
          🎯 <strong>Acertos:</strong> ${acertos}/${a.demo.cenarios.length}<br><br>
          💡 <strong>Princípio final:</strong> NÃO existe modelo universal. PF para contratação, velocity para ágil interno, COCOMO para sistemas críticos, DORA para governança contínua. Saber QUANDO usar cada um é o que diferencia um bom arquiteto.
        </div>`;
      return;
    }
    const c = a.demo.cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>Cenário ${atual+1}/${a.demo.cenarios.length}:</strong><br><br>
        ${c.nome}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${c.opcoes.map((o,i)=>`<button class="alt" data-i="${i}">${o.t}</button>`).join('')}
      </div>
      <div id="ab6-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('.alt').forEach(btn=>{
      btn.onclick=()=>{
        const o = c.opcoes[+btn.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb;
        if(o.c){
          acertos++;
          fb.innerHTML += '<br><button class="btn" style="margin-top:8px">Próximo cenário →</button>';
          wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          btn.disabled = true;
          fb.innerHTML += '<br><em>🔁 As outras opções continuam disponíveis. Tente de novo!</em>';
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  if(estado.demos[abaId] && estado.demos[abaId].parar) estado.demos[abaId].parar();
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
