const estado = {xp:0,selos:new Set(),quizOk:new Set(),demoOk:new Set(),dark:false,apres:false,abaAtiva:null,demos:{}};

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('devops_aula03')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('devops_aula03',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}
function renderTabs(){
  const nav = document.getElementById('tablist');
  nav.innerHTML = '';
  const todas = [...AULA_DADOS.abas,{id:'revisao',titulo:'Revisão'}];
  todas.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.setAttribute('aria-selected','false');
    btn.setAttribute('aria-controls',a.id);
    btn.dataset.id = a.id;
    btn.innerHTML = `${i+1}. ${a.titulo}${a.estudoProprio?'<span class="selo">📖 Estudo próprio</span>':''}`;
    btn.onclick = ()=>irPara(a.id);
    btn.onkeydown = (e)=>{
      if(e.key==='ArrowRight'){const next = btn.nextElementSibling||nav.firstElementChild; next.focus();}
      else if(e.key==='ArrowLeft'){const prev = btn.previousElementSibling||nav.lastElementChild; prev.focus();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();irPara(a.id);}
    };
    nav.appendChild(btn);
  });
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map(alt=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}
function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}
function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));
  }
}
function marcarDemoOk(abaId){
  if(!estado.demoOk.has(abaId)){
    estado.demoOk.add(abaId);
    ganhaXP(5,'Demo concluída');
    verificarAbaCompleta(abaId);
    salvarEstado();
    const area = document.querySelector(`#demo-${abaId}`);
    if(area){
      area.querySelectorAll('button.btn').forEach(b=>{
        if(b.textContent.includes('Concluí')){
          const span = document.createElement('span');
          span.className='selo-chip';
          span.textContent='✓ Demo concluída';
          b.replaceWith(span);
        }
      });
    }
  }
}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<180){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Cubra os 5 pontos do forecast.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/6 a 8|faixa|entre 6|m[íi]n|m[áa]x|21\b/.test(lower)) pontos++;
  if(/cone|hofstadter|incerteza|vari[âa]ncia/.test(lower)) pontos++;
  if(/dividir|reference|calibra|monte carlo|buffer/.test(lower)) pontos++;
  if(/marco|revis|compromisso|previs[ãa]o|p85|confian[çc]a/.test(lower)) pontos++;
  if(/ancoragem|otimismo|padding|vi[ée]s/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Forecast de coach!</strong> Você cobriu ${pontos}/5 pontos. Ganhou 50 XP e o selo "Coach de Forecasting".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Coach de Forecasting');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/5 pontos. Reveja: faixa 6-8 sprints (média 21), cone/Hofstadter vs data única, 3 estratégias (dividir/reference/Monte Carlo), comunicação por marcos+confiança, vieses (ancoragem/otimismo).`;
  }
}

          wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          btn.disabled = true;
          fb.innerHTML += '<br><em>🔁 As outras cartas continuam na mesa. Tente de novo!</em>';
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 2 — Forecasting simulator */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  const hist6 = [21,26,24,30,22,27];
  const st = {backlog:120, janela:6};
  function desenha(){
    const hist = st.janela===6 ? hist6 : hist6.slice(-3);
    const media = hist.reduce((a,b)=>a+b,0)/hist.length;
    const min = Math.min(...hist), max = Math.max(...hist);
    const sMin = Math.ceil(st.backlog/max);
    const sMax = Math.ceil(st.backlog/min);
    const sProv = Math.round(st.backlog/media*10)/10;
    wrap.innerHTML = `
      <div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:6px 0">
        <strong>Histórico de velocity (${st.janela} sprints):</strong> ${hist.join(' · ')} | média ${media.toFixed(1)} | mín ${min} | máx ${max}
      </div>
      <div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:6px 0">
        <label>📦 Backlog: <strong>${st.backlog} pontos</strong></label>
        <input type="range" id="f-b" min="40" max="240" step="20" value="${st.backlog}">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn" data-j="6" style="background:${st.janela===6?'var(--cor)':'#6c757d'}">Janela: 6 sprints</button>
          <button class="btn" data-j="3" style="background:${st.janela===3?'var(--cor)':'#6c757d'}">Janela: últimos 3</button>
        </div>
      </div>
      <div style="padding:14px;background:var(--cor-suave);border-radius:8px;border:2px solid var(--cor)">
        <div style="font-size:1.1rem">🎯 Previsão: <strong>entre ${sMin} e ${sMax} sprints</strong> (mais provável ~${sProv})</div>
        <div class="barra" style="margin-top:8px"><div style="width:${Math.min(100,(sMin/12)*100)}%;background:#2e7d32">otimista ${sMin}</div></div>
        <div class="barra"><div style="width:${Math.min(100,(sProv/12)*100)}%;background:#f9a825;color:#263238">provável ${sProv}</div></div>
        <div class="barra"><div style="width:${Math.min(100,(sMax/12)*100)}%;background:#c62828">pessimista ${sMax}</div></div>
        <div style="font-size:.88rem;color:var(--muted);margin-top:6px">Comunicação sugerida: "terminamos entre ${sMin} e ${sMax} sprints; planejando por ${sProv}, revisamos a cada sprint". Ex.: 120 pts ≈ 4-6 sprints num time estilo Spotify.</div>
      </div>
    `;
    wrap.querySelector('#f-b').oninput=e=>{st.backlog=+e.target.value;desenha();};
    wrap.querySelectorAll('[data-j]').forEach(b=>{
      b.onclick=()=>{st.janela=+b.dataset.j;desenha();};
    });
  }
  area.appendChild(wrap);
  desenha();
}

      ${a.demo.dimensoes.map((d,i)=>`<button class="btn" data-i="${i}" style="background:#546e7a">${d.nome}</button>`).join('')}

    </div>

  area.appendChild(wrap);

/* ABA 4 — Consultório de vieses */
function renderDemoAba4(area,a){
  const wrap = document.createElement('div');
  let atual = 0;
  function desenha(){
    if(atual>=a.demo.cenarios.length){
      wrap.innerHTML = `<div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">✅ <strong>Diagnóstico completo!</strong> Você identificou planning fallacy, ancoragem, padding (+Parkinson) e scope creep — os quatro cavaleiros da estimativa errada. Reconhecer o viés EM TEMPO REAL é metade da cura.</div>`;
      return;
    }
    const c = a.demo.cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>Caso ${atual+1}/${a.demo.cenarios.length}:</strong><br><br>${c.pergunta}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${c.opcoes.map((o,i)=>`<button class="alt" data-i="${i}">${o.t}</button>`).join('')}
      </div>
      <div id="d4-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('.alt').forEach(btn=>{
      btn.onclick=()=>{
        const o = c.opcoes[+btn.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb;
        if(o.c){
          fb.innerHTML += '<br><button class="btn" style="margin-top:8px">Próximo caso →</button>';
          wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          btn.disabled = true;
          fb.innerHTML += '<br><em>🔁 Os outros diagnósticos continuam disponíveis. Tente de novo!</em>';
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 5 — Laboratório de precisão */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  const st = {on:[false,false,false,false]};
  function erroAtual(){
    let e = 75;
    a.demo.estrategias.forEach((s,i)=>{ if(st.on[i]) e = s.erro; });
    // combina: aplica em cascata proporcional
    let base = 75;
    st.on.forEach((on,i)=>{ if(on) base = base * (a.demo.estrategias[i].erro/75); });
    return Math.max(8, Math.round(base));
  }
  function desenha(){
    const e = erroAtual();
    wrap.innerHTML = `
      <div style="padding:12px;background:#fff;border-radius:8px;border:1px solid var(--borda)">
        <div style="display:flex;justify-content:space-between"><strong>Margem de erro atual da estimativa</strong><strong style="color:${e>40?'var(--erro)':e>20?'#f9a825':'var(--ok)'}">±${e}%</strong></div>
        <div class="barra" style="height:30px"><div style="width:${e}%;background:${e>40?'#c62828':e>20?'#f9a825':'#2e7d32'}">±${e}%</div></div>
        <div style="font-size:.85rem;color:var(--muted)">Base sem estratégias: ±75% (típico de estimativa por intuição no início do Cone da Incerteza).</div>
      </div>
      ${a.demo.estrategias.map((s,i)=>`
        <label style="display:flex;gap:10px;align-items:flex-start;padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:6px 0;cursor:pointer">
          <input type="checkbox" data-i="${i}" ${st.on[i]?'checked':''} style="width:20px;height:20px;margin-top:2px">
          <span><strong>${s.nome}</strong> → reduz para ~±${s.erro}% isoladamente<br><em style="font-size:.85rem;color:var(--muted)">${s.custo}</em></span>
        </label>`).join('')}
      <div style="padding:10px;background:#fff8e1;border-radius:6px;border-left:5px solid #ffa000;font-size:.92rem">
        💡 ${e>=50?'Sem estratégias robustas, sua "estimativa" é um chute informado: ±50% ou mais. O Cone da Incerteza manda.'
          :e>=25?'Bom caminho: com divisão + histórico, a faixa já é defensável perante o stakeholder.'
          :'Nível elite: faixa estreita e calibrada — é assim que GDS e times maduros publicam previsões que se cumprem.'}
      </div>
    `;
    wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.onchange=e=>{ st.on[+e.target.dataset.i] = e.target.checked; desenha(); };
    });
  }
  area.appendChild(wrap);
  desenha();
}

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px">
      ${a.demo.casos.map((c,i)=>`<button class="btn" data-i="${i}" style="background:#546e7a">${c.nome}</button>`).join('')}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5); Passo 0 = previsão da demo. Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
