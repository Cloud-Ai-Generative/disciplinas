const estado = {
  xp:0,
  selos:new Set(),
  quizOk:new Set(),
  demoOk:new Set(),

  apres:false,
  abaAtiva:null,
  demos:{}
};

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('devops_aula01')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('devops_aula01',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}

function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function renderTabs(){
  const nav = document.getElementById('tablist');
  nav.innerHTML = '';
  const todas = [...AULA_DADOS.abas,{id:'revisao',titulo:'Revisão'}];
  todas.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.setAttribute('aria-selected','false');
    btn.setAttribute('aria-controls',a.id);
    btn.dataset.id = a.id;
    btn.innerHTML = `${i+1}. ${a.titulo}`;
    btn.onclick = ()=>irPara(a.id);
    btn.onkeydown = (e)=>{
      if(e.key==='ArrowRight'){
        const next = btn.nextElementSibling||nav.firstElementChild;
        next.focus();
      } else if(e.key==='ArrowLeft'){
        const prev = btn.previousElementSibling||nav.lastElementChild;
        prev.focus();
      } else if(e.key==='Enter'||e.key===' '){
        e.preventDefault();irPara(a.id);
      }
    };
    nav.appendChild(btn);
  });
}

function renderMain(){
  const m = document.getElementById('main');
  m.innerHTML = '';
  const pr = document.createElement('div');
  pr.className='progresso';
  pr.id='progresso';
  m.appendChild(pr);
  AULA_DADOS.abas.forEach(a=>{
    const sec = document.createElement('section');
    sec.className='aba';
    sec.id=a.id;
    sec.setAttribute('role','tabpanel');
    sec.innerHTML = renderAba(a);
    m.appendChild(sec);
  });
  const rev = document.createElement('section');
  rev.className='aba';rev.id='revisao';
  rev.setAttribute('role','tabpanel');
  rev.innerHTML = renderRevisao();
  m.appendChild(rev);
  atualizaProgresso();
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map(alt=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}

function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)){
      sessionStorage.setItem(key+'-retry','1');
    }
  }
}

function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));
  }
}

function marcarDemoOk(abaId){
  if(!estado.demoOk.has(abaId)){
    estado.demoOk.add(abaId);
    ganhaXP(5,'Demo concluída');
    verificarAbaCompleta(abaId);
    salvarEstado();
    const area = document.querySelector(`#demo-${abaId}`);
    if(area){
      area.querySelectorAll('button.btn').forEach(b=>{
        if(b.textContent.includes('Concluí')){
          const span = document.createElement('span');
          span.className='selo';
          span.textContent='✓ Demo concluída';
          b.replaceWith(span);
        }
      });
    }
  }
}

function renderRevisao(){
  return `
    <div class="missao"><strong>🎯 Revisão final</strong>Recapitule: Por que estimar → Tríade de ferro → Fatores → Abordagens → Boas práticas.</div>
    <div class="card">
      <h2>🗺️ Mapa da aula</h2>
      <div class="revisao-mapa">
        ${AULA_DADOS.abas.map((a,i)=>`<div class="no"><strong>${i+1}.</strong> ${a.titulo}<br><small>${estado.selos.has(a.titulo.replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25))?'🏅 concluída':'○ pendente'}</small></div>`).join('')}

    </div>
    <div class="chefao" id="chefao">
      <h3>👹 Chefão — o desafio final</h3>
      <p><strong>${AULA_DADOS.revisao.chefao.pergunta}</strong></p>
      <p>Sua resposta deve cobrir 4 passos:</p>
      <ul>${AULA_DADOS.revisao.chefao.criterios.map(c=>`<li>${c}</li>`).join('')}</ul>
      <textarea id="chefaoResp" rows="7" style="width:100%;padding:10px;border-radius:8px;border:2px solid #ffd54f;font-family:inherit;font-size:1rem" placeholder="Escreva sua negociação em 4 passos claros."></textarea><br>

      <div id="chefaoFb" style="margin-top:10px"></div>
    </div>
  `;
}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<120){
    fb.className='fb bad';
    fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Desenvolva os 4 passos da negociação.';
    return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/tr[ií]ade|escopo|recurso|prazo/.test(lower)) pontos++;
  if(/cone|incerteza|margem|erro/.test(lower)) pontos++;
  if(/mvp|op[çc][õo]es|mais prazo|contratar|reduzir/.test(lower)) pontos++;
  if(/sprint|forecast|velocity|revis|burndown|refin/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=3){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Excelente!</strong> Você cobriu ${pontos}/4 passos. Ganhou 50 XP e o selo "Negociador Profissional".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Negociador Profissional');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/4 passos. Reveja: tríade de ferro, Cone da Incerteza, opções (prazo/escopo/recursos), forecasting contínuo.`;
  }
}

/* =========================================================
   DEMOS
   ========================================================= */
function renderDemos(){
  AULA_DADOS.abas.forEach(a=>{
    const area = document.getElementById(`demo-area-${a.id}`);
    if(!area) return;
    if(a.id==='aba-1') renderDemoAba1(area,a);
    else if(a.id==='aba-2') renderDemoAba2(area,a);
    else if(a.id==='aba-3') renderDemoAba3(area,a);
    else if(a.id==='aba-4') renderDemoAba4(area,a);
    else if(a.id==='aba-5') renderDemoAba5(area,a);

/* ABA 1 — Cone da Incerteza */
function renderDemoAba1(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="margin:10px 0">
      <label>Fase do projeto: <strong id="ab1-fase">${a.demo.fases[0].nome}</strong></label>
      <input type="range" id="ab1-slider" min="0" max="${a.demo.fases.length-1}" value="0" step="1">
    </div>
    <div style="padding:16px;background:#fff;border-radius:8px;border:2px solid var(--cor)">
      <div style="font-size:.9rem;color:var(--muted);margin-bottom:8px">Faixa de erro sobre estimativa base de 100h:</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;height:40px;background:#f0f0f0;position:relative;border-radius:4px">
          <div id="ab1-bar" style="position:absolute;height:100%;background:#64b5f6;border-radius:4px;left:25%;width:75%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700"></div>
        </div>
      </div>
      <div style="margin-top:10px;font-size:1.1rem">
        <strong id="ab1-min">25h</strong> — <strong id="ab1-max">400h</strong>
      </div>
      <div id="ab1-interp" style="margin-top:10px;padding:10px;background:#fff3e0;border-radius:6px;font-size:.95rem"></div>
    </div>
  `;
  area.appendChild(wrap);
  const slider = wrap.querySelector('#ab1-slider');
  function atualiza(){
    const f = a.demo.fases[+slider.value];
    wrap.querySelector('#ab1-fase').textContent = f.nome;
    wrap.querySelector('#ab1-min').textContent = Math.round(f.min*100)+'h';
    wrap.querySelector('#ab1-max').textContent = Math.round(f.max*100)+'h';
    const bar = wrap.querySelector('#ab1-bar');
    const base = 400; // escala 0 a 4x = 0% a 100%
    bar.style.left = (f.min/base*100)+'%';
    bar.style.width = ((f.max-f.min)/base*100)+'%';
    bar.textContent = Math.round(f.min*100)+'h a '+Math.round(f.max*100)+'h';
    const interp = wrap.querySelector('#ab1-interp');
    if(f.min===1 && f.max===1){
      interp.innerHTML = '✅ Fase final: a estimativa bateu com o real. Só aqui você tem certeza do esforço.';
    } else {
      const variacao = Math.round((f.max-f.min)*100);
      interp.innerHTML = `⚠️ Variação de <strong>${variacao}%</strong> entre o melhor e o pior cenário. Cliente precisa saber disso!`;
    }
  }
  slider.oninput = atualiza;
  atualiza();
}

/* ABA 2 — WBS */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${a.demo.modulos.map((m,i)=>`<button class="btn" data-i="${i}" style="background:#6c757d">${m.nome}</button>`).join('')}
    </div>
    <div id="ab2-wbs" style="padding:14px;background:#fff;border-radius:8px;min-height:100px;border-left:5px solid var(--cor)">
      <em>👆 Clique em um módulo para decompô-lo em subtarefas.</em>

        </div>

/* ABA 3 — Calculadora de Fatores */
function renderDemoAba3(area,a){
  const wrap = document.createElement('div');
  const base = 100;
  const estadoLocal = {};
  a.demo.fatores.forEach(f=> estadoLocal[f.id] = f.min);
  function atualiza(){
    let mult = 1;
    a.demo.fatores.forEach(f=> mult *= estadoLocal[f.id]);
    const total = base * mult;
    let html = `<div style="padding:12px;background:#fff;border-radius:8px;border:2px solid var(--cor)">
      <div style="font-size:.9rem;color:var(--muted)">Esforço base: <strong>${base}h</strong></div>
      <div style="font-size:1.5rem;color:var(--cor);font-weight:700;margin:8px 0">Esforço ajustado: ${total.toFixed(0)}h</div>
      <div style="font-size:.9rem">Multiplicador total: <strong>${mult.toFixed(2)}×</strong></div>
    </div>`;
    a.demo.fatores.forEach(f=>{
      html += `<div class="fator-box">
        <label><strong>${f.nome}</strong>: ${estadoLocal[f.id].toFixed(2)}× <em>(${f.desc})</em></label>
        <input type="range" data-id="${f.id}" min="${f.min}" max="${f.max}" step="${f.passo}" value="${estadoLocal[f.id]}">
      </div>`;
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('input[type=range]').forEach(inp=>{
      inp.oninput = (e)=>{
        estadoLocal[e.target.dataset.id] = parseFloat(e.target.value);
        atualiza();
      };
    });
  }
  area.appendChild(wrap);
  atualiza();
}

/* ABA 4 — Planning Poker */
function renderDemoAba4(area,a){
  const wrap = document.createElement('div');
  const cartas = [1,2,3,5,8,13,20,'?'];
  const equipe = ['Ana (SR)','Bruno (PL)','Carlos (JR)','Dani (SR)'];
  let histAtual = 0;
  let minhaCarta = null;
  function desenha(){
    const h = a.demo.historias[histAtual];
    const votosSimulados = {
      0:[3,5,5,5], // média ~4.5 -> 5
      1:[8,8,13,13], // média ~10.5 -> 13
      2:[2,3,2,3]  // média ~2.5 -> 3
    };
    const votos = votosSimulados[histAtual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>📖 História ${histAtual+1}:</strong> ${h.titulo}<br>
        <em>${h.descricao}</em><br>
        <span style="font-size:.85rem;color:var(--muted)">Complexidade esperada: ${h.complexidade}</span>
      </div>
      <div><strong>Sua carta (clique):</strong></div>
      <div style="margin:8px 0">
        ${cartas.map(c=>`<div class="carta ${minhaCarta===c?'selected':''}" data-c="${c}">${c}</div>`).join('')}
      </div>
      <button class="btn" id="ab4-reveal">👁️ Revelar votos da equipe</button>
      <div id="ab4-votos" style="margin-top:10px"></div>
      <div style="margin-top:14px">
        <button class="btn sec" id="ab4-prev" ${histAtual===0?'disabled':''}>← Anterior</button>
        <button class="btn" id="ab4-next" ${histAtual===a.demo.historias.length-1?'disabled':''}>Próxima história →</button>
      </div>
    `;
    wrap.querySelectorAll('.carta').forEach(c=>{
      c.onclick = ()=>{
        const val = c.dataset.c;
        minhaCarta = isNaN(+val)?val:+val;
        desenha();
      };
    });
    wrap.querySelector('#ab4-reveal').onclick = ()=>{
      const total = votos.reduce((a,b)=>a+b,0);
      const media = (total/votos.length).toFixed(1);
      const maisProx = [1,2,3,5,8,13,20].reduce((prev,curr)=>
        Math.abs(curr-media) < Math.abs(prev-media)?curr:prev);
      document.getElementById('ab4-votos').innerHTML = `
        <div style="padding:12px;background:#e8f5e9;border-radius:8px;border-left:5px solid var(--ok)">
          <strong>Votos da equipe:</strong><br>
          ${equipe.map((e,i)=>`• ${e}: <strong>${votos[i]} pts</strong>`).join('<br>')}
          <hr style="margin:8px 0;border:none;border-top:1px solid #ccc">
          <strong>Média: ${media} pts</strong> → Consenso arredondado: <strong>${maisProx} story points</strong><br>
          <em style="font-size:.9rem">${
            minhaCarta===null?'Você não votou ainda.':
            minhaCarta===maisProx?'✅ Você acertou o consenso!':
            `Você votou ${minhaCarta}. Em Planning Poker real, se diverge muito, discute-se e vota-se de novo.`
          }</em>
        </div>
      `;
    };
    wrap.querySelector('#ab4-prev').onclick = ()=>{ histAtual--; minhaCarta=null; desenha(); };
    wrap.querySelector('#ab4-next').onclick = ()=>{ histAtual++; minhaCarta=null; desenha(); };
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 5 — Cenário gerente */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  let etapa = 0;
  function desenha(){
    if(etapa>=a.demo.cenarios.length){
      wrap.innerHTML = `
        <div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">
          ✅ <strong>Você completou o dia como gerente!</strong><br><br>
          Em projetos reais (iFood, Nubank, Spotify), esses dilemas aparecem toda semana. O padrão dos times maduros é sempre:
          <ul>
            <li>Transparência com cliente</li>
            <li>Revisão contínua de estimativas</li>
            <li>Usar dados reais (velocity), não achismo</li>
          </ul>
        </div>`;
      return;
    }
    const c = a.demo.cenarios[etapa];
    wrap.innerHTML = `<div style="padding:12px;background:#fff;border-radius:8px;border:2px solid var(--cor)"><strong>Cenário ${etapa+1}:</strong> ${c.pergunta}</div>`+
      c.opcoes.map((o,i)=>`<button class="alt" style="width:100%;margin-top:6px" data-i="${i}">${o.t}</button>`).join('');
    wrap.querySelectorAll('.alt').forEach(b=>{
      b.onclick = ()=>{
        const o = c.opcoes[+b.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb+'<br><button class="btn" style="margin-top:8px">Próximo cenário →</button>';
        wrap.appendChild(fb);
        wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
        fb.querySelector('button').onclick=()=>{etapa++;desenha();};
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  if(estado.demos[abaId] && estado.demos[abaId].parar) estado.demos[abaId].parar();
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){ location.hash = id; }
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}

document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';
    r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba. Aba "Revisão" fecha os 30 min.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
