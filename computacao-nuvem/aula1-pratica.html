function carregarEstado(){

    estado.selos = new Set(s.selos||[]);

    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}

function salvarEstado(){
  localStorage.setItem('nuvem_aula01',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),

function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}

/* Fisher-Yates */
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function renderTabs(){
  const nav = document.getElementById('tablist');
  nav.innerHTML = '';
  const todas = [...AULA_DADOS.abas,{id:'revisao',titulo:'Revisão'}];
  todas.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.setAttribute('aria-selected','false');
    btn.setAttribute('aria-controls',a.id);
    btn.dataset.id = a.id;
    btn.innerHTML = `${i+1}. ${a.titulo}${a.estudoProprio?'<span class="selo">📖 Estudo próprio</span>':''}`;
    btn.onclick = ()=>irPara(a.id);
    btn.onkeydown = (e)=>{
      if(e.key==='ArrowRight'){
        const next = btn.nextElementSibling||nav.firstElementChild;
        next.focus();
      } else if(e.key==='ArrowLeft'){
        const prev = btn.previousElementSibling||nav.lastElementChild;
        prev.focus();
      } else if(e.key==='Enter'||e.key===' '){
        e.preventDefault();irPara(a.id);
      }
    };
    nav.appendChild(btn);
  });
}

function renderMain(){
  const m = document.getElementById('main');
  m.innerHTML = '';
  // progresso
  const pr = document.createElement('div');
  pr.className='progresso';
  pr.id='progresso';
  m.appendChild(pr);
  // abas
  AULA_DADOS.abas.forEach(a=>{
    const sec = document.createElement('section');
    sec.className='aba';
    sec.id=a.id;
    sec.setAttribute('role','tabpanel');
    sec.innerHTML = renderAba(a);
    m.appendChild(sec);
  });
  // revisão
  const rev = document.createElement('section');
  rev.className='aba';rev.id='revisao';
  rev.setAttribute('role','tabpanel');
  rev.innerHTML = renderRevisao();
  m.appendChild(rev);
  atualizaProgresso();
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map((alt,i)=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}

function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      estado.quizOk.add(key);
      ganhaXP(10,'Acerto de primeira!');
      // verifica aba completa
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    // retry: as outras continuam habilitadas
    // se já acertou antes em retry
    if(estado.quizOk.has(key)){
      // nada a fazer
    } else {
      // marca como tentativa, mas não conta XP ainda
      const primeiraKey = key+'-retry';
      if(!sessionStorage.getItem(primeiraKey)){
        sessionStorage.setItem(primeiraKey,'1');
      }
    }
  }
}

function verificarAbaCompleta(abaId){

  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    adicionaSelo(aba.titulo.split('📖')[0].trim().substring(0,30));
  }
}

}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();

    fb.style.display='block';

    return;

  const lower = t.toLowerCase();
  let pontos = 0;
  if(/capex|opex|investimento|mensal|assinatura/.test(lower)) pontos++;
  if(/elastic|pico|demanda|automátic/.test(lower)) pontos++;
  if(/iso 27001|soc 2|lgpd|seguran|certific/.test(lower)) pontos++;
  if(/ia |inteligência|machine learn|diagnóstic|prontuário/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=3){

    fb.innerHTML=`✅ <strong>Excelente!</strong> Você cobriu ${pontos}/4 critérios. Ganhou 50 XP e o selo "Chefão Vencedor".`;

    l.setAttribute('x2',a.demo.nos[i+1].x);l.setAttribute('y2',a.demo.nos[i+1].y+15);
    l.setAttribute('stroke','#888');l.setAttribute('stroke-width','2');
    svg.appendChild(l);
  }
  // nós
  a.demo.nos.forEach(n=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',n.x);c.setAttribute('cy',n.y+15);c.setAttribute('r',18);
    c.setAttribute('fill','#e67e22');c.setAttribute('stroke','#c0392b');c.setAttribute('stroke-width','2');

    t.setAttribute('x',n.x);t.setAttribute('y',n.y+60);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','11');t.setAttribute('fill','#333');
    t.textContent=n.nome;
    svg.appendChild(t);
  });
  area.appendChild(svg);
  const ctrl = document.createElement('div');
  ctrl.innerHTML = `
    <select id="ab2-dest" style="padding:6px;border-radius:6px;border:1px solid #ccc">
      <option value="sri">Stanford (SRI)</option>
      <option value="ucsb">UCSB</option>
      <option value="utah">U. Utah</option>
    </select>
    <button class="btn" onclick="enviarMsg()">📨 Enviar mensagem</button>
    <button class="btn sec" onclick="falharNo()">💥 Falhar nó do meio</button>
    <div id="ab2-log" style="margin-top:10px;font-family:monospace;white-space:pre-wrap"></div>
  `;
  area.appendChild(ctrl);
  estado.demos.aba2 = {falhou:null};
}
function enviarMsg(){
  const dest = document.getElementById('ab2-dest').value;
  const log = document.getElementById('ab2-log');
  const rota = ['ucla'];
  if(estado.demos.aba2.falhou==='sri' && dest!=='sri'){
    rota.push('(SRI falhou — contornando)');
    // acha outro caminho via ucsb
    rota.push('ucsb');
    if(dest==='utah') rota.push('utah');
  } else {
    if(dest==='sri') rota.push('sri');
    else if(dest==='ucsb'){rota.push('sri');rota.push('ucsb');}
    else {rota.push('sri');rota.push('ucsb');rota.push('utah');}
  }
  log.innerHTML = `📤 Enviando LOGIN para ${dest}...\nCaminho: ${rota.join(' → ')}\n✅ Mensagem chegou! (Resiliência ARPANET)`;
}
function falharNo(){
  estado.demos.aba2.falhou='sri';
  document.getElementById('ab2-log').innerHTML='💥 Nó SRI falhou. Tente enviar novamente e veja o caminho alternativo.';
}

/* ABA 5 — Simulador Black Friday */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn" id="ab5-manual">📏 Modo Manual (escalabilidade tradicional)</button>
      <button class="btn" id="ab5-auto">🤖 Modo Automático (elasticidade nuvem)</button>
    </div>
    <div id="ab5-sim" style="padding:12px;background:#fff;border-radius:8px;border:1px solid #ccc">Clique em um modo para iniciar a simulação de 12 meses.</div>
  `;
  area.appendChild(wrap);
  const sim = wrap.querySelector('#ab5-sim');
  let timer=null;
  function parar(){ if(timer){clearInterval(timer);timer=null;} }
  function rodar(modo){
    parar();
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov-Black','Dez'];
    const demandas = [10,10,10,10,15,15,15,20,20,30,100,40];
    let custoTotal = 0;
    let html = '<table style="width:100%;border-collapse:collapse;font-size:.9rem"><tr><th>Mês</th><th>Demanda</th><th>Servidores</th><th>Custo mês</th><th>Status</th></tr>';
    let i = 0;
    timer = setInterval(()=>{
      if(i>=meses.length){
        parar();
        html += `<tr style="font-weight:bold;background:#fff3cd"><td colspan="3">TOTAL 12 meses</td><td>US$ ${custoTotal.toFixed(0)}</td><td>${modo==='auto'?'👉 Mais econômico!':'👉 Caro no longo prazo'}</td></tr></table>`;
        sim.innerHTML = html;
        return;
      }
      const d = demandas[i];
      let serv, custo, status;
      if(modo==='manual'){
        // provisionado fixo para o pico
        serv = 100; custo = serv*10; status='ocioso em meses baixos';
      } else {
        serv = d; custo = serv*10; status = d>30?'🔥 elástico':'✅ ajustado';
      }
      custoTotal += custo;
      html += `<tr><td>${meses[i]}</td><td>${d}</td><td>${serv}</td><td>US$ ${custo}</td><td>${status}</td></tr>`;
      sim.innerHTML = html+'</table>';
      i++;
    },400);
  }
  wrap.querySelector('#ab5-manual').onclick=()=>rodar('manual');
  wrap.querySelector('#ab5-auto').onclick=()=>rodar('auto');
  estado.demos.aba5 = {parar};
}

/* =========================================================
   NAVEGAÇÃO / HASH / PROGRESSO
   ========================================================= */
function irPara(id){
  location.hash = id;
}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}

/* =========================================================
   TOAST
   ========================================================= */
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}

/* =========================================================
   MODO APRESENTAÇÃO / DARK
   ========================================================= */
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';

    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';

    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio. Aba "Revisão" fecha os 30 min.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
