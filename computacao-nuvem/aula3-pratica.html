const estado = {xp:0,selos:new Set(),quizOk:new Set(),demoOk:new Set(),dark:false,apres:false,abaAtiva:null,demos:{}};

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('cloud_aula03')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('cloud_aula03',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `

      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}
function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}
function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);

  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));

  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);

  }

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<180){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Cubra as três frentes + riscos + veredito.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/azure/.test(lower) && /(entra|arc|app service|vm|sql)/.test(lower)) pontos++;
  if(/aws/.test(lower) && /(ec2|eks|lambda|cloudfront|auto.?scaling|s3)/.test(lower)) pontos++;
  if(/gcp|google/.test(lower) && /(bigquery|vertex|tpu|gke)/.test(lower)) pontos++;
  if(/lock.?in|egress|complexidade|multinuvem|multi.?cloud/.test(lower)) pontos++;
  if(/reserva|savings|committed|desconto|compromisso/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Arquitetura aprovada!</strong> Você cobriu ${pontos}/5 pontos. Ganhou 50 XP e o selo "Arquiteto Multi-Cloud".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Arquiteto Multi-Cloud');
  } else {
    fb.className='fb bad';

  }
}

/* ABA 2 — Montador de stack AWS */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  const st = {ec2:1, s3:100, rds:0, lambda:0, cf:0};
  const precos = {
    ec2:{rot:"🖥️ EC2 (t3.medium Linux)",un:"instância",custo:32,passo:1,max:10},
    s3:{rot:"🗄️ S3 (armazenamento)",un:"GB",custo:0.023,passo:50,max:2000},
    rds:{rot:"🐬 RDS MySQL (db.t4g.micro + 100GB)",un:"instância",custo:28,passo:1,max:4},
    lambda:{rot:"⚡ Lambda (requisições)",un:"mi req",custo:0.20,passo:1,max:100},
    cf:{rot:"🌍 CloudFront (transferência)",un:"TB",custo:85,passo:1,max:50}
  };
  function total(){
    return st.ec2*precos.ec2.custo + st.s3*precos.s3.custo + st.rds*precos.rds.custo +
           st.lambda*precos.lambda.custo + st.cf*precos.cf.custo;
  }
  function desenha(){
    let html = '';
    Object.keys(precos).forEach(k=>{
      const p = precos[k];
      const ativo = st[k]>0;
      html += `
        <div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:6px 0">
          <label style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <strong>${p.rot}</strong>
            <span>${st[k]} ${p.un} → <strong style="color:var(--cor)">US$ ${(st[k]*p.custo).toFixed(2)}/mês</strong></span>
          </label>
          <input type="range" data-k="${k}" min="0" max="${p.max}" step="${p.passo}" value="${st[k]}">
        </div>`;
    });
    html += `
      <div style="padding:14px;background:#f9fbe7;border-radius:8px;border:2px solid var(--cor);margin-top:10px">
        <div style="font-size:1.2rem">💵 Fatura mensal estimada: <strong>US$ ${total().toFixed(2)}</strong></div>
        <div style="font-size:.85rem;color:var(--muted);margin-top:4px">Valores aproximados de tabela (us-east-1), sem reservas. Linha dominante: ${linhaDominante()}.</div>
      </div>`;
    wrap.innerHTML = html;
    wrap.querySelectorAll('input[type=range]').forEach(inp=>{
      inp.oninput = e=>{ st[e.target.dataset.k] = +e.target.value; desenha(); };
    });
  }
  function linhaDominante(){
    const linhas = Object.keys(precos).map(k=>({k, v: st[k]*precos[k].custo}));
    linhas.sort((x,y)=>y.v-x.v);
    return linhas[0].v>0 ? precos[linhas[0].k].rot : 'nenhuma';
  }
  area.appendChild(wrap);
  desenha();
}

      const c = a.demo.cargas[+b.dataset.i];
      document.getElementById('ab4-reveal').innerHTML = `
        <strong>${c.nome}</strong><br><br>
        🧩 <strong>Serviço GCP:</strong> <span style="color:var(--cor);font-weight:700">${c.servico}</span><br>
        🎯 <strong>Por quê:</strong> ${c.porque}<br><br>
        <div style="padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000">
          🌍 <strong>Caso real:</strong> ${c.caso}
        </div>
      `;
    };
  });
}

/* ABA 5 — Simulador de cotação */
function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  const st = {vcpu:16, ram:64, ssd:1000, res:false};
  const tab = {
    aws:{nome:"AWS", vcpu:30, ram:4.0, ssd:0.10, cor:"#e65100"},
    az:{nome:"Azure", vcpu:29, ram:3.8, ssd:0.09, cor:"#1565c0"},
    gcp:{nome:"GCP", vcpu:27, ram:3.6, ssd:0.085, cor:"#c62828"}
  };
  function custo(k){
    const t = tab[k];
    let v = st.vcpu*t.vcpu + st.ram*t.ram + st.ssd*t.ssd;
    if(st.res) v *= 0.65;
    return v;
  }
  function desenha(){
    const vals = {aws:custo('aws'), az:custo('az'), gcp:custo('gcp')};
    const max = Math.max(vals.aws, vals.az, vals.gcp);
    const menor = Object.keys(vals).reduce((a,b)=>vals[a]<=vals[b]?a:b);
    wrap.innerHTML = `
      <div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);margin:6px 0">
        <label>⚙️ vCPU: <strong>${st.vcpu}</strong></label>
        <input type="range" id="q-v" min="2" max="64" step="2" value="${st.vcpu}">
        <label>🧠 RAM: <strong>${st.ram} GB</strong></label>
        <input type="range" id="q-r" min="4" max="256" step="4" value="${st.ram}">
        <label>💾 SSD: <strong>${st.ssd} GB</strong></label>
        <input type="range" id="q-s" min="100" max="2000" step="100" value="${st.ssd}">
        <label style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <input type="checkbox" id="q-res" ${st.res?'checked':''} style="width:18px;height:18px">
          <strong>📅 Reserva/compromisso de 1 ano (−35%)</strong>
        </label>
      </div>
      <div style="padding:12px;background:#fff;border-radius:8px;border:1px solid var(--borda)">
        ${Object.keys(tab).map(k=>`
          <div style="margin:6px 0">
            <div style="display:flex;justify-content:space-between;font-size:.9rem"><strong>${tab[k].nome}</strong><span>US$ ${vals[k].toFixed(0)}/mês ${k===menor?'🏆':''}</span></div>
            <div class="barra-prov"><div style="width:${(vals[k]/max*100).toFixed(1)}%;background:${tab[k].cor}"></div></div>
          </div>`).join('')}
        <div style="font-size:.85rem;color:var(--muted);margin-top:6px">Estimativa didática (preços de tabela aproximados, us-east/São Paulo). 🏆 = menor fatura neste cenário.</div>
      </div>
    `;
    wrap.querySelector('#q-v').oninput=e=>{st.vcpu=+e.target.value;desenha();};
    wrap.querySelector('#q-r').oninput=e=>{st.ram=+e.target.value;desenha();};
    wrap.querySelector('#q-s').oninput=e=>{st.ssd=+e.target.value;desenha();};
    wrap.querySelector('#q-res').onchange=e=>{st.res=e.target.checked;desenha();};
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 6 — Estudos de caso */
function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${a.demo.casos.map((c,i)=>`<button class="btn" data-i="${i}" style="background:#546e7a">${c.nome}</button>`).join('')}
    </div>
    <div id="ab6-reveal" style="margin-top:14px;padding:14px;border-radius:8px;background:#f9fbe7;min-height:120px;border-left:5px solid var(--cor)">
      <em>👆 Clique em um caso para ver motivação e lição.</em>
    </div>
  `;
  area.appendChild(wrap);
  wrap.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const c = a.demo.casos[+b.dataset.i];
      document.getElementById('ab6-reveal').innerHTML = `
        <strong>${c.nome}</strong><br><br>
        🎯 <strong>Motivação:</strong> ${c.motivo}<br><br>
        <div style="padding:10px;background:#fff8e1;border-radius:6px;border-left:4px solid #ffa000">
          💡 <strong>Lição:</strong> ${c.licao}
        </div>
      `;
    };
  });
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
</body>
</html>
