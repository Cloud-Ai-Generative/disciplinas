function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

/* ABA 1 — Sniffer */
function renderDemoAba1(area,a){
  const wrap = document.createElement('div');
  let timer = null;
  let fila = [];
  let caps = 0;
  function parar(){ if(timer){clearInterval(timer);timer=null;} }
  function payload(tls){
    return tls ? '17 03 03 4a f2 9c …(cifrado)' : 'POST /login user=ana.cpf=***.***.**-00 cartao=4532…';
  }
  function desenha(){
    wrap.innerHTML = `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        <button class="btn" id="ab1-env-claro">📨 Enviar pacote SEM criptografia</button>
        <button class="btn" id="ab1-env-tls" style="background:#2e7d32">🔒 Enviar pacote COM TLS</button>
        <button class="btn sec" id="ab1-cap">🕵️ Interceptar próximo pacote</button>
        <button class="btn sec" id="ab1-stop">⏹ Parar tráfego</button>
      </div>
      <div style="padding:10px;background:#fff;border-radius:8px;border:1px solid var(--borda);min-height:90px">
        <strong>Tráfego na rede:</strong><br>
        ${fila.slice(-8).map(p=>`<span class="pkt ${p.tls?'tls':''} ${p.cap?'cap':''}">${p.tls?'🔒':'📄'} ${p.resumo}</span>`).join('') || '<em>sem pacotes — envie alguns</em>'}
      </div>
      <div class="console" id="ab1-out" style="margin-top:10px">Sniffer passivo armado. Pacotes interceptados: ${caps}.\nAguardando tráfego...</div>
    `;
    wrap.querySelector('#ab1-env-claro').onclick=()=>{ iniciar(false); };
    wrap.querySelector('#ab1-env-tls').onclick=()=>{ iniciar(true); };
    wrap.querySelector('#ab1-stop').onclick=()=>{ parar(); };
    wrap.querySelector('#ab1-cap').onclick=()=>{
      const out = wrap.querySelector('#ab1-out');
      const alvo = fila.find(p=>!p.cap);
      if(!alvo){ out.textContent = 'Nada para interceptar agora. Envie pacotes primeiro.'; return; }
      alvo.cap = true; caps++;
      if(alvo.tls){
        out.textContent = `🕵️ Pacote #${fila.indexOf(alvo)+1} capturado (TLS 1.3):\n`+
          `Conteúdo lido: ${payload(true)}\n`+
          `➡️ ILEGÍVEL. Sem a chave da sessão, o sniffer vê apenas bytes aleatórios.\n`+
          `Metadados visíveis: IPs e portas (origem/destino). Confidencialidade do CONTEÚDO preservada.`;
      } else {
        out.textContent = `🕵️ Pacote #${fila.indexOf(alvo)+1} capturado (texto claro):\n`+
          `Conteúdo lido: ${payload(false)}\n`+
          `🚨 VAZAMENTO: credenciais e dados pessoais expostos ao atacante na mesma rede!`;
      }
      desenha();
    };
  }
  function iniciar(tls){
    parar();
    let n = 0;
    timer = setInterval(()=>{
      n++;
      fila.push({tls, cap:false, resumo: tls?`pkt TLS #${fila.length+1}`:`pkt claro #${fila.length+1}`});
      if(fila.length>14) fila.shift();
      desenha();
      if(n>=6) parar();
    },500);
  }
  area.appendChild(wrap);
  desenha();
  estado.demos.aba1 = {parar};
}

/* ABA 2 — Hash */
function renderDemoAba2(area,a){
  const wrap = document.createElement('div');
  function hashFake(s){
    // FNV-1a 32bits x4 com sementes -> 32 hex chars (simulação didática)
    function fnv(seed){
      let h = seed >>> 0;
      for(let i=0;i<s.length;i++){
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return h >>> 0;
    }
    let out = '';
    [0x811c9dc5,0x01000193,0xdeadbeef,0xcafebabe].forEach(sd=>{
      out += fnv(sd).toString(16).padStart(8,'0');
    });
    return out;
  }
  const st = {msg:'Transferir R$ 500,00 para Ana Souza', original:null, atual:null};
  function desenha(){
    wrap.innerHTML = `
      <label><strong>📄 Mensagem / arquivo:</strong></label>
      <textarea id="ab2-msg" rows="2" style="width:100%;padding:8px;border-radius:6px;border:2px solid var(--cor);font-family:inherit;margin-top:4px">${st.msg}</textarea>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" id="ab2-gen">🧮 Gerar hash SHA-256 (simulado)</button>
        <button class="btn sec" id="ab2-flip">🔀 Alterar 1 caractere</button>
        <button class="btn sec" id="ab2-ver">✅ Verificar integridade</button>
      </div>
      <div style="margin-top:10px">
        <div style="font-size:.85rem;color:var(--muted)">Hash ORIGINAL guardado (publicado pela fonte):</div>
        <div class="hashbox" id="ab2-h0">${st.original||'—'}</div>
        <div style="font-size:.85rem;color:var(--muted);margin-top:6px">Hash do conteúdo ATUAL:</div>
        <div class="hashbox" id="ab2-h1">${st.atual||'—'}</div>
      </div>
      <div id="ab2-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelector('#ab2-gen').onclick=()=>{
      st.msg = wrap.querySelector('#ab2-msg').value;
      const h = hashFake(st.msg);
      if(st.original===null){ st.original = h; }
      st.atual = h;
      desenha();
    };
    wrap.querySelector('#ab2-flip').onclick=()=>{
      st.msg = wrap.querySelector('#ab2-msg').value;
      if(st.msg.length<2){return;}
      const i = Math.floor(st.msg.length/2);
      const ch = st.msg[i];
      const novo = ch==='a'?'A':(ch==='X'?'Y':'X');
      st.msg = st.msg.slice(0,i)+novo+st.msg.slice(i+1);
      st.atual = hashFake(st.msg);
      desenha();
      const fb = wrap.querySelector('#ab2-fb');
      fb.className='fb bad';
      fb.innerHTML='🔀 1 caractere alterado no meio da mensagem. Compare os hashes: o efeito avalanche mudou quase todos os dígitos.';
    };
    wrap.querySelector('#ab2-ver').onclick=()=>{
      const fb = wrap.querySelector('#ab2-fb');
      if(!st.original||!st.atual){ fb.className='fb bad'; fb.innerHTML='Gere o hash original primeiro.'; return; }
      if(st.original===st.atual){
        fb.className='fb ok';
        fb.innerHTML='✅ <strong>Integridade CONFIRMADA:</strong> hashes idênticos. O conteúdo não foi alterado desde a publicação.';
      } else {
        fb.className='fb bad';
        fb.innerHTML='🚨 <strong>Integridade VIOLADA:</strong> hashes diferentes. O conteúdo foi adulterado após a publicação do hash original. Não confie no arquivo!';
      }
    };
  }
  area.appendChild(wrap);
  desenha();
}

  function desenha(log, disp){

        <input type="range" id="ab3-a" min="0" max="200" step="10" value="${st.atk}">
        <label>️ Capacidade do alvo: <strong>${st.cap} Gbps</strong></label>
        <input type="range" id="ab3-c" min="1" max="50" step="1" value="${st.cap}">
        <label style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <input type="checkbox" id="ab3-m" ${st.mit?'checked':''} style="width:18px;height:18px">
          <strong>🛡️ Mitigação anti-DDoS (scrubbing/CDN, absorve até 120 Gbps)</strong>
        </label>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="ab3-run">▶️ Simular 10 ticks</button>
        <button class="btn sec" id="ab3-stop">⏹ Parar</button>
      </div>
      <div class="console" id="ab3-log" style="margin-top:10px">${log||'Configure o cenário e rode a simulação.'}</div>
      ${disp!==undefined?`<div style="margin-top:8px;padding:10px;background:${disp>95?'#d4edda':disp>70?'#fff3cd':'#f8d7da'};border-radius:6px;font-weight:700">Disponibilidade medida: ${disp.toFixed(1)}%</div>`:''}
    `;
    wrap.querySelector('#ab3-a').oninput=e=>{st.atk=+e.target.value;desenha();};
    wrap.querySelector('#ab3-c').oninput=e=>{st.cap=+e.target.value;desenha();};
    wrap.querySelector('#ab3-m').onchange=e=>{st.mit=e.target.checked;desenha();};
    wrap.querySelector('#ab3-stop').onclick=()=>parar();
    wrap.querySelector('#ab3-run').onclick=()=>{
      parar();
      let t=0, ok=0;
      let log='';
      timer=setInterval(()=>{
        t++;
        const efetivo = st.mit ? Math.max(0, st.atk-120) : st.atk;
        const carga = efetivo + 2; // 2 Gbps de tráfego legítimo
        const servido = Math.min(carga, st.cap);
        const legitOk = carga<=st.cap ? 2 : Math.max(0, st.cap - efetivo);
        const okTick = Math.min(2, Math.max(0, legitOk));
        ok += okTick>1.5?1:(okTick>0?0.5:0);
        log += `tick ${String(t).padStart(2,'0')}: ataque ${efetivo} Gbps + legítimo 2 → capacidade ${st.cap} | legítimo servido: ${okTick.toFixed(1)}/2\n`;
        const el = wrap.querySelector('#ab3-log');
        if(el) el.textContent = log;
        if(t>=10){
          parar();
          const disp = (ok/10)*100;
          log += `\n✅ Fim. Disponibilidade: ${disp.toFixed(1)}%` + (st.mit?' (com mitigação)':' (SEM mitigação)');
          desenha(log, disp);
        }
      },350);
    };
  }
  area.appendChild(wrap);
  desenha();
  estado.demos.aba3 = {parar};
}

/* ABA 4 — Comitê de riscos */
function renderDemoAba4(area,a){
  const wrap = document.createElement('div');
  let atual = 0;
  function desenha(){
    if(atual>=a.demo.cenarios.length){
      wrap.innerHTML = `
        <div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">
          ✅ <strong>Comitê concluído!</strong> Você aplicou as quatro estratégias: mitigar, transferir, aceitar e evitar.<br><br>
          💡 <strong>Lição:</strong> gestão de riscos não é eliminar todo risco — é alocar recursos onde o risco excede o apetite, e documentar o que foi aceito.
        </div>`;
      return;
    }
    const c = a.demo.cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>Situação ${atual+1}/${a.demo.cenarios.length}:</strong><br><br>${c.pergunta}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${c.opcoes.map((o,i)=>`<button class="alt" data-i="${i}">${o.t}</button>`).join('')}
      </div>
      <div id="ab4-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('.alt').forEach(btn=>{
      btn.onclick=()=>{
        const o = c.opcoes[+btn.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb;
        if(o.c){
          fb.innerHTML += '<br><button class="btn" style="margin-top:8px">Próxima situação →</button>';
          wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          btn.disabled = true;
          fb.innerHTML += '<br><em>🔁 As outras opções continuam disponíveis. Tente de novo!</em>';
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 5 — Scanner */

  const wrap = document.createElement('div');
  const achados = [
    {id:"CVE-2021-44228",nome:"Log4Shell (Apache Log4j)",cvss:10.0,sev:"CRÍTICA",exp:"Exploração remota sem autenticação via JNDI lookup.",cia:"C+I+A",fix:"Atualizar Log4j para 2.17.1+ e remover autoconfiguração de JNDI."},
    {id:"CVE-2017-0144",nome:"EternalBlue (SMBv1)",cvss:8.1,sev:"ALTA",exp:"Execução remota de código via SMB; usada pelo WannaCry.",cia:"C+I+A",fix:"Desativar SMBv1 e aplicar patch MS17-010; segmentar rede."},
    {id:"CFG-001",nome:"Senha padrão em serviço exposto à internet",cvss:6.5,sev:"MÉDIA",exp:"Painel administrativo acessível publicamente com credencial de fábrica.",cia:"C+I+A",fix:"Trocar credenciais, exigir MFA e remover exposição direta (VPN/zero-trust)."},
    {id:"CVE-2014-0160",nome:"Heartbleed (OpenSSL)",cvss:7.5,sev:"ALTA",exp:"Leitura de memória do servidor TLS; vaza chaves e sessões.",cia:"C",fix:"Atualizar OpenSSL e REVOGAR/reemitir certificados e sessões."},
    {id:"CFG-002",nome:"TLS 1.0 habilitado",cvss:5.9,sev:"MÉDIA",exp:"Protocolo obsoleto sujeito a downgrade e quebra de cifra.",cia:"C",fix:"Desativar TLS 1.0/1.1; exigir TLS 1.2+ com cifras modernas."}
  ];
  let timer = null;
  function parar(){ if(timer){clearInterval(timer);timer=null;} }
  function desenha(log, pronto){
    wrap.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="ab5-run">🔬 Executar varredura em 10.0.0.7</button>
        <button class="btn sec" id="ab5-stop">⏹ Parar</button>
      </div>
      <div class="console" id="ab5-log" style="margin-top:10px">${log||'Scanner pronto (base de CVEs sincronizada). Execute a varredura.'}</div>
      <div id="ab5-list" style="margin-top:10px"></div>
    `;
    wrap.querySelector('#ab5-stop').onclick=()=>parar();
    wrap.querySelector('#ab5-run').onclick=()=>{
      parar();
      let i=0;
      let log='';
      const lista = wrap.querySelector('#ab5-list');
      timer=setInterval(()=>{
        i+=10;
        log = `varrendo portas, serviços e versões... ${i}%`;
        const el = wrap.querySelector('#ab5-log');
        if(el) el.textContent = log;
        if(i>=100){
          parar();
          log = `varredura concluída: 5 achados (1 crítica, 2 altas, 2 médias).\nClique em cada achado para ver impacto e remediação.`;
          desenha(log, true);
        }
      },200);
    };
    if(pronto){
      const lista = wrap.querySelector('#ab5-list');
      lista.innerHTML = achados.map((f,idx)=>`
        <button class="btn" data-i="${idx}" style="background:${f.sev==='CRÍTICA'?'#b71c1c':f.sev==='ALTA'?'#e65100':'#f9a825'};color:${f.sev==='MÉDIA'?'#263238':'#fff'}">
          ${f.id} — CVSS ${f.cvss.toFixed(1)} (${f.sev})
        </button>`).join('') + `<div id="ab5-det" style="margin-top:10px"></div>`;
      lista.querySelectorAll('[data-i]').forEach(b=>{
        b.onclick=()=>{
          const f = achados[+b.dataset.i];
          lista.querySelector('#ab5-det').innerHTML = `
            <div style="padding:12px;background:#fff;border-radius:8px;border-left:5px solid var(--cor)">
              <strong>${f.id} — ${f.nome}</strong> | CVSS <strong>${f.cvss.toFixed(1)}</strong> (${f.sev})<br><br>
              💥 <strong>Exploração:</strong> ${f.exp}<br>
              🎯 <strong>Pilares afetados:</strong> ${f.cia}<br><br>
              <div style="padding:8px;background:#e8f5e9;border-radius:6px;border-left:4px solid var(--ok)">
                🔧 <strong>Remediação:</strong> ${f.fix}
              </div>
            </div>`;
        };
      });
    }
  }
  area.appendChild(wrap);
  desenha();
  estado.demos.aba5 = {parar};
}

/* ABA 6 — Matriz 5x5 */
function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  function zona(p,i){
    const v = p*i;
    if(v>=15) return {rot:'EXTREMO',cor:'#b71c1c',txt:'Tratamento imediato, escala à diretoria, plano de ação com dono e prazo.'};
    if(v>=8)  return {rot:'ALTO',cor:'#e65100',txt:'Mitigar no ciclo atual; monitorar com KRI dedicado.'};
    if(v>=4)  return {rot:'MÉDIO',cor:'#f9a825',txt:'Mitigar conforme orçamento; revisar trimestralmente.'};
    return {rot:'BAIXO',cor:'#2e7d32',txt:'Aceitar ou monitorar; revisar anualmente.'};
  }
  const exemplos = {
    '5-5':{ex:'Ransomware em servidores de produção SEM backup (probável e catastrófico).',tr:'Mitigar agora: backup imutável + patches + segmentação.'},
    '4-5':{ex:'Bucket S3 público com dados de clientes e scans constantes da internet.',tr:'Mitigar imediato + DLP; residual vira risco de compliance LGPD.'},
    '2-5':{ex:'Incêndio no único data center (raro, catastrófico — cisne negro).',tr:'Mitigar com redundância geográfica + DR testado; transferir parte via seguro.'},
    '5-2':{ex:'Phishing recorrente causando retrabalho pequeno (frequente, impacto baixo).',tr:'Mitigar com treinamento + filtro; aceitar residual após controles.'},
    '1-1':{ex:'Falha estética em relatório interno pouco usado.',tr:'Aceitar e registrar.'},
    '3-3':{ex:'Vulnerabilidade média em sistema interno segmentado.',tr:'Mitigar no ciclo de patches padrão (SLA 30 dias).'}
  };
  let html = `<div class="matriz">`;
  html += `<div class="cel hdr"></div>`;
  for(let i=1;i<=5;i++) html += `<div class="cel hdr">I${i}</div>`;
  for(let p=5;p>=1;p--){
    html += `<div class="cel hdr">P${p}</div>`;
    for(let i=1;i<=5;i++){
      const z = zona(p,i);
      html += `<div class="cel" data-p="${p}" data-i="${i}" style="background:${z.cor};color:#fff">${p*i}</div>`;
    }
  }
  html += `</div>
    <div style="font-size:.85rem;color:var(--muted);margin-top:6px">Linhas = Probabilidade (P1 rara → P5 quase certa) • Colunas = Impacto (I1 insignificante → I5 catastrófico)</div>
    <div id="ab6-det" style="margin-top:12px;padding:12px;background:#fff;border-radius:8px;border-left:5px solid var(--cor);min-height:80px">
      <em>👆 Clique em uma célula para ver zona, exemplos reais e tratamento esperado.</em>
    </div>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('.cel[data-p]').forEach(c=>{
    c.onclick=()=>{
      const p=+c.dataset.p, i=+c.dataset.i;
      const z = zona(p,i);
      const chave = `${p}-${i}`;
      const ex = exemplos[chave] || {ex:`Risco com probabilidade ${p} e impacto ${i} (score ${p*i}).`,tr:z.txt};
      wrap.querySelector('#ab6-det').innerHTML = `
        <strong>Célula P${p} × I${i} — Zona ${z.rot}</strong> (score ${p*i})<br><br>
        📌 <strong>Exemplo:</strong> ${ex.ex}<br>
        🧭 <strong>Tratamento esperado:</strong> ${ex.tr}<br>
        <em style="font-size:.9rem">Regra da zona: ${z.txt}</em>
      `;
    };
  });
  area.appendChild(wrap);
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  if(estado.demos[abaId] && estado.demos[abaId].parar) estado.demos[abaId].parar();
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

carregarEstado();
renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
</script>
