const estado = {xp:0,selos:new Set(),quizOk:new Set(),demoOk:new Set(),dark:false,apres:false,abaAtiva:null,demos:{}};

function carregarEstado(){
  try{
    const s = JSON.parse(localStorage.getItem('seg_aula01')||'{}');
    estado.xp = s.xp||0;
    estado.selos = new Set(s.selos||[]);
    estado.quizOk = new Set(s.quizOk||[]);
    estado.demoOk = new Set(s.demoOk||[]);
  }catch(e){}
}
function salvarEstado(){
  localStorage.setItem('seg_aula01',JSON.stringify({
    xp:estado.xp,
    selos:Array.from(estado.selos),
    quizOk:Array.from(estado.quizOk),
    demoOk:Array.from(estado.demoOk)
  }));
}
function ganhaXP(n,motivo){
  estado.xp += n;
  showToast(`+${n} XP — ${motivo}`);
  atualizaProgresso();
  salvarEstado();
}
function adicionaSelo(s){
  if(!estado.selos.has(s)){
    estado.selos.add(s);
    showToast(`🏅 Selo: ${s}`);
    atualizaProgresso();
    salvarEstado();
  }
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}
function renderTabs(){
  const nav = document.getElementById('tablist');
  nav.innerHTML = '';
  const todas = [...AULA_DADOS.abas,{id:'revisao',titulo:'Revisão'}];
  todas.forEach((a,i)=>{
    const btn = document.createElement('button');
    btn.role = 'tab';
    btn.setAttribute('aria-selected','false');
    btn.setAttribute('aria-controls',a.id);
    btn.dataset.id = a.id;
    btn.innerHTML = `${i+1}. ${a.titulo}${a.estudoProprio?'<span class="selo">📖 Estudo próprio</span>':''}`;
    btn.onclick = ()=>irPara(a.id);
    btn.onkeydown = (e)=>{
      if(e.key==='ArrowRight'){const next = btn.nextElementSibling||nav.firstElementChild; next.focus();}
      else if(e.key==='ArrowLeft'){const prev = btn.previousElementSibling||nav.lastElementChild; prev.focus();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();irPara(a.id);}
    };
    nav.appendChild(btn);
  });
}

function renderQuiz(abaId,idx,q){
  const key = `${abaId}-${idx}`;
  const misturadas = shuffle(q.alts);
  return `
    <div class="quiz-perg" data-key="${key}" data-aba="${abaId}">
      <h4>Pergunta ${idx+1}. ${q.p}</h4>
      <div class="alts">
        ${misturadas.map(alt=>`<button class="alt" data-c="${alt.c?1:0}" data-fb='${alt.fb.replace(/'/g,'&#39;')}' onclick="respQuiz(this)">${alt.t}</button>`).join('')}
      </div>
      <div class="fb" id="fb-${key}"></div>
    </div>
  `;
}
function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}
function verificarAbaCompleta(abaId){
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(!aba) return;
  const todas = aba.quiz.every((_,i)=>estado.quizOk.has(`${abaId}-${i}`));
  const demo = estado.demoOk.has(abaId);
  if(todas && demo){
    const nomeSelo = aba.titulo.split('📖')[0].replace(/[^\w\sÀ-ú]/g,'').trim().substring(0,25);
    adicionaSelo(nomeSelo||aba.titulo.substring(0,25));
  }
}
function marcarDemoOk(abaId){
  if(!estado.demoOk.has(abaId)){
    estado.demoOk.add(abaId);
    ganhaXP(5,'Demo concluída');
    verificarAbaCompleta(abaId);
    salvarEstado();
    const area = document.querySelector(`#demo-${abaId}`);
    if(area){
      area.querySelectorAll('button.btn').forEach(b=>{
        if(b.textContent.includes('Concluí')){
          const span = document.createElement('span');
          span.className='selo-chip';
          span.textContent='✓ Demo concluída';
          b.replaceWith(span);
        }
      });
    }
  }
}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<150){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Desenvolva os 5 riscos com mitigações.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/vazamento|prontu[áa]rio|confidencialidade|criptograf/.test(lower)) pontos++;
  if(/ransomware|backup|disponibilidade|recuper/.test(lower)) pontos++;
  if(/fraude|identidade|mfa|autenticidade|crm/.test(lower)) pontos++;
  if(/integridade|assinatura digital|prescri|[çc]arimbo|n[ãa]o-rep[úu]dio/.test(lower)) pontos++;
  if(/lgpd|dpo|conformidade|encarregado|marco civil|72h/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Excelente!</strong> Você cobriu ${pontos}/5 riscos. Ganhou 50 XP e o selo "CISO de Telemedicina".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('CISO de Telemedicina');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/5 riscos. Reveja: vazamento+criptografia, ransomware+backup, fraude+MFA, integridade+assinatura, LGPD+DPO.`;
  }
}

function renderDemoAba2(area,a){

  function desenha(){
    const c = a.demo.cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>Cenário ${atual+1}/${a.demo.cenarios.length}:</strong><br><br>

      <div style="margin:10px 0">
        <div class="cia-card cia-C ${estadoLocal.marcados.has('C')?'selected':''}" data-p="C">🔒 <strong>C</strong>onfidencialidade</div>
        <div class="cia-card cia-I ${estadoLocal.marcados.has('I')?'selected':''}" data-p="I">📝 <strong>I</strong>ntegridade</div>
        <div class="cia-card cia-A ${estadoLocal.marcados.has('A')?'selected':''}" data-p="A">⚡ <strong>A</strong>disponibilidade</div>

      <div id="ab2-fb" style="margin-top:10px"></div>
      <div style="margin-top:10px">
        <button class="btn sec" id="ab2-next" style="display:none">Próximo cenário →</button>
      </div>
    `;
    wrap.querySelectorAll('.cia-card').forEach(card=>{
      card.onclick=()=>{
        const p = card.dataset.p;
        if(estadoLocal.marcados.has(p)) estadoLocal.marcados.delete(p);
        else estadoLocal.marcados.add(p);
        desenha();
      };
    });
    const checkBtn = wrap.querySelector('#ab2-check');
    if(checkBtn) checkBtn.onclick=()=>{
      const corretas = new Set(c.resposta);
      const acertos = [...estadoLocal.marcados].filter(x=>corretas.has(x)).length;
      const erros = [...estadoLocal.marcados].filter(x=>!corretas.has(x)).length;
      const faltas = [...corretas].filter(x=>!estadoLocal.marcados.has(x)).length;
      const fb = wrap.querySelector('#ab2-fb');
      if(acertos===corretas.size && erros===0){
        fb.className='fb ok';
        fb.innerHTML=`✅ <strong>Perfeito!</strong> ${c.explicacao}`;
      } else if(acertos>0 && faltas>0){
        fb.className='fb bad';
        fb.innerHTML=`⚠️ <strong>Parcial.</strong> Você acertou ${acertos} de ${corretas.size}. ${c.explicacao}<br><em>🔁 Revise sua seleção e tente de novo.</em>`;
        // não desativa, permite retry
        return;
      } else {
        fb.className='fb bad';
        fb.innerHTML=`❌ <strong>Incorreto.</strong> ${c.explicacao}<br><em>🔁 Revise sua seleção e tente de novo.</em>`;
        return;
      }
      wrap.querySelectorAll('.cia-card').forEach(c=>c.style.pointerEvents='none');
      checkBtn.style.display='none';
      wrap.querySelector('#ab2-next').style.display='inline-block';
      if(atual===a.demo.cenarios.length-1){
        wrap.querySelector('#ab2-next').textContent='🎉 Concluir demo';
      }
    };
    const nextBtn = wrap.querySelector('#ab2-next');
    if(nextBtn) nextBtn.onclick=()=>{
      if(atual<a.demo.cenarios.length-1){
        atual++;
        estadoLocal.marcados.clear();

function renderDemoAba3(area,a){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="padding:12px;background:#fff;border-radius:8px;border:2px solid var(--cor)">
      <label><strong>📝 Digite sua mensagem:</strong></label><br>
      <input id="ab3-msg" type="text" value="Contrato de prestação de serviços entre João e Maria S.A." style="width:100%;padding:8px;border-radius:6px;border:2px solid #ccc;font-family:inherit;margin-top:6px">
      <div style="margin-top:10px">
        <button class="btn" id="ab3-sign">🔐 Assinar com chave privada</button>
        <button class="btn sec" id="ab3-tamper" style="display:none">😈 Adulterar mensagem</button>
      </div>
      <div id="ab3-result" style="margin-top:14px"></div>
    </div>
  `;
  area.appendChild(wrap);
  // função hash simulada (soma de códigos)
  function hashFake(s){
    let h = 0;
    for(let i=0;i<s.length;i++){h = ((h<<5)-h) + s.charCodeAt(i); h|=0;}
    return Math.abs(h).toString(16).toUpperCase().padStart(8,'0');
  }
  const orig = {msg:'',hash:'',sig:''};
  wrap.querySelector('#ab3-sign').onclick=()=>{
    orig.msg = wrap.querySelector('#ab3-msg').value;
    orig.hash = hashFake(orig.msg);
    orig.sig = 'SIG_'+orig.hash+'_JOAO';
    document.getElementById('ab3-result').innerHTML = `
      <div style="padding:12px;background:#e8f5e9;border-radius:6px;border-left:5px solid var(--ok)">
        ✅ <strong>Mensagem assinada com sucesso!</strong><br><br>
        📄 <strong>Original:</strong> ${orig.msg}<br>
        🔢 <strong>Hash (SHA-256 simulado):</strong> <code>${orig.hash}</code><br>
        ✍️ <strong>Assinatura digital:</strong> <code>${orig.sig}</code><br><br>
        <em>💡 A assinatura prova AUTENTICIDADE (veio do João), INTEGRIDADE (hash único) e NÃO-REPÚDIO (João não pode negar).</em>
      </div>
    `;
    wrap.querySelector('#ab3-tamper').style.display='inline-block';
  };
  wrap.querySelector('#ab3-tamper').onclick=()=>{
    const novoMsg = orig.msg.replace('serviços','FRAUDE');
    const novoHash = hashFake(novoMsg);
    document.getElementById('ab3-result').innerHTML = `
      <div style="padding:12px;background:#f8d7da;border-radius:6px;border-left:5px solid var(--erro)">
        🚨 <strong>ADULTERAÇÃO DETECTADA!</strong><br><br>
        📄 <strong>Mensagem adulterada:</strong> ${novoMsg}<br>
        🔢 <strong>Novo hash:</strong> <code>${novoHash}</code><br>
        📊 <strong>Hash original era:</strong> <code>${orig.hash}</code><br><br>
        ❌ <strong>Os hashes não batem!</strong> A assinatura é inválida. Em um tribunal, isso prova que o documento foi adulterado após a assinatura.<br>
        <em>🎯 Princípio protegido: INTEGRIDADE (e por consequência, NÃO-REPÚDIO).</em>
      </div>
    `;
  };
}

function renderDemoAba5(area,a){
  const wrap = document.createElement('div');
  let atual = 0;
  function desenha(){
    if(atual>=a.demo.cenarios.length){
      wrap.innerHTML = `
        <div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">
          ✅ <strong>Você completou o dia como CISO!</strong><br><br>
          🎯 <strong>Princípios que você aplicou:</strong><br>
          • Zero Trust: nunca confiar, sempre verificar<br>
          • Responsabilidade compartilhada em nuvem<br>
          • BYOD com MDM para controle<br>
          • Tríade pessoas-processos-tecnologia contra phishing<br><br>
          💡 Esses são exatamente os princípios que CISOs de Nubank, iFood e Mercado Livre aplicam diariamente.
        </div>`;
      return;
    }
    const c = a.demo.cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px">
        <strong>🎯 Cenário ${atual+1}/${a.demo.cenarios.length}:</strong><br><br>
        ${c.cenario}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${c.opcoes.map((o,i)=>`<button class="alt" data-i="${i}">${o.t}</button>`).join('')}
      </div>
      <div id="ab5-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('.alt').forEach(btn=>{
      btn.onclick=()=>{
        const o = c.opcoes[+btn.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb+'<br><button class="btn" style="margin-top:8px">Próximo cenário →</button>';
        wrap.appendChild(fb);
        wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
        if(o.c){
          // acertou, avança
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          // errou, permite retry nas outras
          fb.querySelector('button').remove();
          const retryHint = document.createElement('div');
          retryHint.style.cssText='margin-top:8px;font-size:.9rem;color:var(--erro)';
          retryHint.innerHTML='<em>🔁 As outras opções continuam disponíveis. Tente de novo!</em>';
          fb.appendChild(retryHint);
        }
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);

  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'🌙';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'🎤';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5). Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});
