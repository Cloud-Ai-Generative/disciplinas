function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function respQuiz(btn){
  const p = btn.closest('.quiz-perg');
  const key = p.dataset.key;
  const abaId = p.dataset.aba;
  const fb = btn.dataset.fb;
  const c = btn.dataset.c === '1';
  const fbd = p.querySelector('.fb');
  if(c){
    btn.classList.add('certa');
    btn.innerHTML = '✓ '+btn.innerHTML;
    p.querySelectorAll('.alt').forEach(b=>b.disabled=true);
    fbd.className='fb ok';
    fbd.innerHTML='✅ <strong>Por que esta está certa:</strong> '+fb;
    if(!estado.quizOk.has(key)){
      const wasRetry = sessionStorage.getItem(key+'-retry');
      estado.quizOk.add(key);
      ganhaXP(wasRetry?5:10, wasRetry?'Acerto no retry!':'Acerto de primeira!');
      sessionStorage.removeItem(key+'-retry');
      verificarAbaCompleta(abaId);
      salvarEstado();
    }
  } else {
    btn.classList.add('errada');
    btn.innerHTML = '✗ '+btn.innerHTML;
    btn.disabled = true;
    fbd.className='fb bad';
    fbd.innerHTML='❌ <strong>Por que esta está errada:</strong> '+fb+'<br><em>🔁 Tente outra alternativa.</em>';
    if(!estado.quizOk.has(key)) sessionStorage.setItem(key+'-retry','1');
  }
}

function entregarChefao(){
  const t = document.getElementById('chefaoResp').value.trim();
  const fb = document.getElementById('chefaoFb');
  if(t.length<160){
    fb.className='fb bad';fb.style.display='block';
    fb.innerHTML='❌ Resposta muito curta. Cubra os 5 pontos do diagnóstico.';return;
  }
  const lower = t.toLowerCase();
  let pontos = 0;
  if(/stack trace|breakpoint|watch|reproduz|log/.test(lower)) pontos++;
  if(/parse|float|decimal|centavos|inteiro|string|v[íi]rgula/.test(lower)) pontos++;
  if(/centavos.{0,30}inteiro|decimal|int\b|arredond/.test(lower)) pontos++;
  if(/regress[ãa]o|teste automatizado|ci\b|staging/.test(lower)) pontos++;
  if(/caso m[íi]nimo|borda|isolar/.test(lower)) pontos++;
  fb.style.display='block';
  if(pontos>=4){
    fb.className='fb ok';
    fb.innerHTML=`✅ <strong>Diagnóstico de engenheiro!</strong> Você cobriu ${pontos}/5 pontos. Ganhou 50 XP e o selo "Caçador de Bugs".`;
    ganhaXP(50,'Chefão concluído');
    adicionaSelo('Caçador de Bugs');
  } else {
    fb.className='fb bad';
    fb.innerHTML=`❌ Você cobriu apenas ${pontos}/5 pontos. Reveja: trace/breakpoint/reprodução, causa de parse float vs centavos, correção com inteiros/Decimal, regressão+staging, caso mínimo/bordas.`;
  }
}

    `;
    wrap.querySelectorAll('[data-c]').forEach(b=>{
      b.onclick=()=>{ cenario=b.dataset.c; pc=0; fim=false; saida=[]; desenha(); };
    });
    wrap.querySelector('#d1-reset').onclick=()=>{ pc=0; fim=false; saida=[]; desenha(); };
    wrap.querySelector('#d1-step').onclick=()=>{

        {t:"Pedir para o cliente enviar o dado sem pontuação",c:0,fb:"Paliativo que transfere o bug para o usuário. O sistema deve aceitar o formato documentado; o defeito é seu, não do cliente."}
      ]},
    {pergunta:"✅ Bug corrigido. Como garantir que ele NUNCA volte?",
      opcoes:[
        {t:"Criar teste de regressão automatizado que falharia com o bug antigo",c:1,fb:"Correto! O teste 'congela' a lição: se alguém reintroduzir o bug, o CI barra o deploy (Jest, pytest, JUnit no GitHub Actions). É a memória executável do time."},
        {t:"Confiar no teste manual feito uma vez",c:0,fb:"Manual não se repete a cada deploy. Em 3 meses alguém muda o código e o bug volta calado — regressão existe para isso."},
        {t:"Deixar um comentário 'não mexer aqui' no código",c:0,fb:"Comentário não impede ninguém. Só verificação automatizada (teste/lint) garante. Comentário apodrece; teste falha gritando."}
      ]}
  ];
  let atual = 0;
  function desenha(){
    if(atual>=cenarios.length){
      wrap.innerHTML = `<div style="padding:14px;background:#d4edda;border-radius:8px;border-left:5px solid var(--ok)">✅ <strong>Plantão encerrado!</strong> Você aplicou o método: diagnosticar (trace + reprodução) → isolar (caso mínimo) → blindar (regressão). É exatamente o ciclo que separa engenharia de improviso — e o que evitaria casos como o da Knight Capital.</div>`;
      return;
    }
    const c = cenarios[atual];
    wrap.innerHTML = `
      <div style="padding:14px;background:#fff;border-radius:8px;border:2px solid var(--cor);margin-bottom:10px"><strong>Situação ${atual+1}/${cenarios.length}:</strong><br><br>${c.pergunta}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${c.opcoes.map((o,i)=>`<button class="alt" data-i="${i}">${o.t}</button>`).join('')}</div>
      <div id="d5-fb" style="margin-top:10px"></div>
    `;
    wrap.querySelectorAll('.alt').forEach(btn=>{
      btn.onclick=()=>{
        const o = c.opcoes[+btn.dataset.i];
        const fb = document.createElement('div');
        fb.className = 'fb '+(o.c?'ok':'bad');
        fb.innerHTML = (o.c?'✅':'❌')+' '+o.fb;
        if(o.c){
          fb.innerHTML += '<br><button class="btn" style="margin-top:8px">Próxima situação →</button>';
          wrap.querySelectorAll('.alt').forEach(x=>x.disabled=true);
          fb.querySelector('button').onclick=()=>{atual++;desenha();};
        } else {
          btn.disabled = true;
          fb.innerHTML += '<br><em>🔁 As outras opções continuam disponíveis. Tente de novo!</em>';
        }
        wrap.appendChild(fb);
      };
    });
  }
  area.appendChild(wrap);
  desenha();
}

/* ABA 6 — Mini-debugger */
function renderDemoAba6(area,a){
  const wrap = document.createElement('div');
  const linhas = [
    "x = 10",
    "y = 0",
    "enquanto x > 0 faca",
    "    y = y + x",
    "    x = x - 3",
    "fim enquanto",
    "escreva y"
  ];
  let st;
  function reset(){ st = {pc:0, x:null, y:null, out:'', fim:false}; }
  reset();
  function execLinha(){
    switch(st.pc){
      case 0: st.x = 10; st.pc = 1; break;
      case 1: st.y = 0; st.pc = 2; break;
      case 2: st.pc = (st.x > 0) ? 3 : 6; break;
      case 3: st.y = st.y + st.x; st.pc = 4; break;
      case 4: st.x = st.x - 3; st.pc = 2; break;
      case 6: st.out = String(st.y); st.pc = 7; st.fim = true; break;
      default: st.fim = true;
    }
  }
  function desenha(){
    wrap.innerHTML = `
      <pre class="code" style="cursor:default">${linhas.map((l,i)=>`<span class="ln ${i===st.pc&&!st.fim?'cur':''} ${i<st.pc||st.fim?'done':''}">${String(i+1).padStart(2,'0')}  ${l}</span>`).join('')}</pre>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="d6-step" ${st.fim?'disabled':''}>▶ Step (1 linha)</button>
        <button class="btn" id="d6-cont" ${st.fim?'disabled':''}>⏩ Continuar</button>
        <button class="btn sec" id="d6-reset">🔄 Reiniciar</button>
      </div>
      <div style="margin-top:8px">
        <span class="watch">x = <b>${st.x===null?'—':st.x}</b></span>
        <span class="watch">y = <b>${st.y===null?'—':st.y}</b></span>
        <span class="watch">SAÍDA = <b>${st.out||'—'}</b></span>
      </div>
      ${st.fim?`<div style="margin-top:10px;padding:10px;background:#d4edda;border-radius:6px;border-left:5px solid var(--ok)">✅ Fim da execução: <strong>escreva y → ${st.out}</strong>. Conferiu com sua previsão? (10+7+4+1 = 22; o laço testa x>0 ANTES de cada volta.)</div>`:''}
    `;
    wrap.querySelector('#d6-step').onclick=()=>{ execLinha(); desenha(); };
    wrap.querySelector('#d6-cont').onclick=()=>{ let guard=0; while(!st.fim && guard<100){ execLinha(); guard++; } desenha(); };
    wrap.querySelector('#d6-reset').onclick=()=>{ reset(); desenha(); };
  }
  area.appendChild(wrap);
  desenha();
}

function reiniciarDemo(abaId){
  const area = document.getElementById(`demo-area-${abaId}`);
  if(!area) return;
  area.innerHTML = '';
  const aba = AULA_DADOS.abas.find(a=>a.id===abaId);
  if(abaId==='aba-1') renderDemoAba1(area,aba);
  else if(abaId==='aba-2') renderDemoAba2(area,aba);
  else if(abaId==='aba-3') renderDemoAba3(area,aba);
  else if(abaId==='aba-4') renderDemoAba4(area,aba);
  else if(abaId==='aba-5') renderDemoAba5(area,aba);
  else if(abaId==='aba-6') renderDemoAba6(area,aba);
  showToast('🔄 Demo reiniciada');
}

function irPara(id){location.hash=id;}
function aplicarHash(){
  let id = location.hash.replace('#','') || AULA_DADOS.abas[0].id;
  if(!document.getElementById(id)) id = AULA_DADOS.abas[0].id;
  document.querySelectorAll('section.aba').forEach(s=>s.classList.toggle('ativa',s.id===id));
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sel = b.dataset.id===id;
    b.setAttribute('aria-selected',sel?'true':'false');
  });
  estado.abaAtiva = id;
  window.scrollTo({top:0,behavior:'smooth'});
}
function atualizaProgresso(){
  const pr = document.getElementById('progresso');
  if(!pr) return;
  pr.innerHTML = `
    <span>⭐ XP: <span class="xp">${estado.xp}</span></span>
    <span>🏅 Selos:</span>
    <span class="selos">${estado.selos.size?Array.from(estado.selos).map(s=>`<span class="selo-chip">${s}</span>`).join(''):'<em style="color:var(--muted)">conquiste ao completar demos e quizzes</em>'}</span>
  `;
}
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#263238;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:200;font-weight:600;opacity:0;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity='1';
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.style.opacity='0',2200);
}
document.getElementById('btnDark').onclick = ()=>{
  estado.dark = !estado.dark;
  document.body.classList.toggle('dark',estado.dark);
  document.getElementById('btnDark').textContent = estado.dark?'☀️':'';
};
document.getElementById('btnApres').onclick = ()=>{
  estado.apres = !estado.apres;
  document.body.classList.toggle('apresentacao',estado.apres);
  document.getElementById('btnApres').textContent = estado.apres?'📖':'';
  if(estado.apres){
    document.body.classList.remove('dark');
    estado.dark=false;
    document.getElementById('btnDark').textContent='🌙';
    const r = document.createElement('div');
    r.className='rota-apres';r.id='rotaApres';
    r.innerHTML = '🎤 <strong>Modo Apresentação:</strong> use ← → para navegar. Roteiro: 6 min por aba (1–5); Passo 0 = previsão da demo. Aba 6 é estudo próprio.';
    document.body.appendChild(r);
  } else {
    const r = document.getElementById('rotaApres');
    if(r) r.remove();
  }
};
document.addEventListener('keydown',(e)=>{
  if(!estado.apres) return;
  const abas = AULA_DADOS.abas.map(a=>a.id).concat(['revisao']);
  const idx = abas.indexOf(estado.abaAtiva);
  if(e.key==='ArrowRight' && idx<abas.length-1){irPara(abas[idx+1]);e.preventDefault();}
  else if(e.key==='ArrowLeft' && idx>0){irPara(abas[idx-1]);e.preventDefault();}
});

renderTabs();
renderMain();
renderDemos();
window.addEventListener('hashchange',aplicarHash);
aplicarHash();
