<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viagem no Tempo: da Pólis ao Feudo</title>
<meta name="description" content="Jogo de revisão de História para o 6º ano: Grécia, Roma e Idade Média.">
<style>
:root{
  --bg:#1d1a2b; --paper:#fffaf0; --ink:#2b2118; --muted:#6f5f4f; --line:#e2d4bb;
  --grecia:#2f6f9f; --roma:#a63d2f; --medieval:#4f6b3a; --gold:#e0a82e;
  --ok:#2e7d4f; --err:#c0392b; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg) radial-gradient(circle at 20% 0%,#3a2f5a 0,#1d1a2b 60%) fixed;color:var(--ink);line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:.2em 0 .4em}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:820px;margin:0 auto;padding:12px}
/* HUD */
.hud{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;background:rgba(20,16,32,.92);color:#fff;backdrop-filter:blur(4px)}
.hud .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:6px 11px;font-size:.9rem;white-space:nowrap}
.pill.on{background:var(--gold);color:#2b2118;font-weight:700}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 4px 0 #000a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000a}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--paper);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 6px 0 #0004}
.title-screen{text-align:center;color:#fff;padding:20px 8px}
.title-screen h1{font-size:2rem;color:var(--gold);text-shadow:0 3px 0 #000}
.title-screen p{max-width:560px;margin:8px auto;color:#e6dcff}
/* cena */
.scene{position:relative;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.dialog{display:flex;gap:10px;align-items:flex-end;background:var(--paper);padding:12px 14px;border-radius:0 0 var(--radius) var(--radius);box-shadow:0 6px 0 #0004}
.dialog .who{flex:0 0 72px}
.bubble{flex:1;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;position:relative;font-size:.98rem}
.bubble::before{content:"";position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right-color:var(--ink)}
.bubble b{display:block;font-family:Georgia,serif;color:var(--muted);font-size:.85rem}
/* barra de status da fase */
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.hearts{font-size:1.4rem;letter-spacing:2px}
.combo{font-weight:800;color:var(--roma)}
.timer{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--err),var(--gold));transition:width 1s linear}
/* mapa */
.trail{position:relative;padding:6px 0 20px}
.band{border-radius:var(--radius);padding:12px 10px 18px;margin:12px 0;position:relative;overflow:hidden}
.band h2{color:#fff;text-shadow:0 2px 0 #0006;margin:0 0 6px;font-size:1.25rem}
.band.grecia{background:linear-gradient(#6fb3e0,#2f6f9f)}
.band.roma{background:linear-gradient(#e0926f,#8e3226)}
.band.medieval{background:linear-gradient(#9cc27a,#3f5a2e)}
.band.boss{background:linear-gradient(#5b4a8a,#241c3d)}
.nodes{display:flex;flex-direction:column;gap:10px}
.node{display:flex;align-items:center;gap:10px;background:rgba(255,250,240,.95);border:0;border-radius:14px;padding:8px 12px;text-align:left;color:var(--ink);box-shadow:0 4px 0 #0003;width:85%;position:relative}
.node:nth-child(even){align-self:flex-end}
.node .gear{flex:0 0 40px;height:40px}
.node small{display:block;color:var(--muted)}
.node .st{margin-left:auto;color:var(--gold);font-size:1.05rem;white-space:nowrap}
.node.lock{opacity:.55;cursor:not-allowed}
.node.cur{outline:4px solid var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline-color:#fff6}}
.traveler{position:absolute;right:-6px;top:-30px;width:40px;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
/* jogos */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:6px 0}
.chip{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:9px 12px;color:var(--ink);text-align:left;touch-action:none;user-select:none;box-shadow:0 3px 0 var(--ink)}
.chip.sel{background:var(--ink);color:#fff}
.chip.done{border-color:var(--ok);background:#e6f3ea;box-shadow:none;cursor:default}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 10px 20px #0005}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:10px}
.bin{border:3px dashed var(--muted);border-radius:14px;padding:10px;min-height:120px;background:#fff8ea;text-align:left;color:var(--ink);transition:transform .1s,background .1s}
.bin h4{margin:0 0 6px;font-size:1rem}
.bin .chip{font-size:.82rem;padding:4px 8px;margin:3px;display:inline-block;box-shadow:none}
.bin.hint,.bin.over{border-color:var(--ink);background:#ffecc2}
.bin.over{transform:scale(1.03)}
.glow{animation:glow .8s 3}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--gold)}}
.fb{border-radius:12px;padding:10px 12px;margin-top:12px;display:none}
.fb.ok{display:block;background:#e6f3ea;color:#1d5236;border-left:6px solid var(--ok)}
.fb.err{display:block;background:#fbe9e7;color:#7d2620;border-left:6px solid var(--err)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tf{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tf .btn{flex:1;min-width:120px}
.statement{font-size:1.1rem;font-weight:600;padding:14px;background:#fff;border-radius:12px;border:2px solid var(--line)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:11px;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.opt.right{border-color:var(--ok);background:#e6f3ea;box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--err);background:#fbe9e7;box-shadow:none;opacity:.7}
.opt.pick{background:var(--ink);color:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.cols{grid-template-columns:1fr}}
.order-list{display:grid;gap:6px;counter-reset:n}
.order-slot{background:#fff;border:2px solid var(--ok);border-radius:10px;padding:8px 12px}
.order-slot::before{counter-increment:n;content:counter(n) ". ";font-weight:700;color:var(--ok)}
.counter{color:var(--muted);font-size:.9rem}
.float{position:fixed;z-index:100;font-weight:800;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;animation:up 1s forwards;font-size:1.2rem}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
/* resultado */
.qbox{background:#fff;border-left:6px solid var(--gold);padding:12px 14px;border-radius:8px}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps li{counter-increment:s;position:relative;padding:8px 8px 8px 42px;margin:6px 0;background:#fff;border-radius:10px;border:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.model{background:#f2f7ee;border:1px solid #cfe0c3;border-radius:10px;padding:14px;margin:10px 0}
.model mark,.counter mark{background:#ffe9a8;padding:0 2px;border-radius:3px}
.warn{background:#fff3d6;border-radius:10px;padding:10px 12px;font-size:.95rem}
.terms{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.term{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.term b{display:block;font-family:Georgia,serif}
.term.locked{color:var(--muted);font-style:italic}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:14px}
.big-stars{font-size:2.6rem;color:var(--gold);text-align:center;letter-spacing:6px;text-shadow:0 3px 0 #0003}
.spin{animation:spin 4s linear infinite;transform-origin:center;transform-box:fill-box}
.spin.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}}
@media print{.hud,footer,.btn,button{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
.overlay{position:fixed;inset:0;z-index:90;background:#0009;display:grid;place-items:center;padding:14px}
.overlay .card{max-width:520px;width:100%}
footer{color:#bfb3e0;text-align:center;font-size:.85rem;padding:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hud">
  <div class="grp">
    <button class="pill" onclick="go('map')">🗺️ Mapa</button>
    <button class="pill" onclick="go('dict')">📖 Dicionário</button>
    <button class="pill" onclick="go('trilha')">📋 Trilha</button>
  </div>
  <div class="grp">
    <span class="pill" id="hGears" title="Engrenagens">⚙️ 0/10</span>
    <span class="pill" id="hCoins" title="Moedas">🪙 0</span>
    <button class="pill" id="hSound" onclick="toggleSound()" aria-label="Som">🔊</button>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer>Material de revisão · História · 6º ano · Grécia, Roma e Idade Média</footer>

let AC=null;
function beep(notes,type="sine",dur=.12){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,k)=>{
      const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+k*dur;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur*1.7);
    });
  }catch(e){}
}

    <button class="pill ${S.desafio?"on":""}" style="color:${S.desafio?"":"var(--ink)"};background:${S.desafio?"":"#eee"}" onclick="S.desafio=!S.desafio;save();SFX.click();renderMap()">⏱️ Modo Desafio: ${S.desafio?"LIGADO":"desligado"}</button></div>`;
  for(const era of ["grecia","roma","medieval"]){
    const nm={grecia:"🏛️ Grécia Antiga",roma:"🦅 Roma Antiga",medieval:"🏰 Idade Média"}[era];
    h+=`<section class="band ${era}"><h2>${nm}</h2><div class="nodes">`;
    LEVELS.forEach((L,i)=>{ if(L.era!==era) return;
      const lock=!unlocked(i), st=S.stars[i];
      h+=`<button class="node ${lock?"lock":""} ${i===cur?"cur":""}" ${lock?"disabled":""} onclick="SFX.click();go('play',${i})">
        ${gearIcon(st!==undefined)}<span><small>${lvLabel(L)}</small><b>${L.titulo}</b></span>
        <span class="st">${st!==undefined?starStr(st):(lock?"🔒":"▶")}</span>
        ${i===cur?`<span class="traveler">${charSVG(TRAVELER,40)}</span>`:""}</button>`;
    });
    h+=`</div></section>`;
  }
  const bossOk = gears()===NL;
  h+=`<section class="band boss"><h2>⚙️ Desafio da Máquina</h2><div class="nodes">
    <button class="node ${bossOk?"":"lock"} ${bossOk&&!S.boss?"cur":""}" ${bossOk?"":"disabled"} onclick="go('boss')">
      ${gearIcon(S.boss)}<span><small>Fase final · perguntas das 3 eras contra o relógio</small><b>Religar a máquina do tempo</b></span>
      <span class="st">${S.boss?"🏆":(bossOk?"▶":"🔒")}</span>
      ${bossOk&&!S.boss?`<span class="traveler">${charSVG(TRAVELER,40)}</span>`:""}</button></div></section>
  <div class="row" style="justify-content:center"><button class="btn sec" onclick="if(confirm('Apagar todo o progresso?')){S={stars:{},coins:0,sound:S.sound,desafio:false,boss:false};save();go('title')}">Recomeçar do zero</button></div>`;
  app.innerHTML=h;
  const c=document.querySelector(".node.cur"); if(c && gears()) c.scrollIntoView({block:"center"});
}

/* ================= DICIONÁRIO ================= */
function renderDict(){
  S.mydict=S.mydict||[];
  let h=`<div class="card"><h1>📖 Dicionário histórico</h1>
    <h2 style="margin-top:14px">✏️ Meu dicionário</h2>
    <p class="counter">Anote aqui as palavras que você <b>não conhecia</b> ou das quais tinha dúvida durante a leitura dos capítulos.</p>
    <div style="display:grid;gap:8px">
      <input id="mw" placeholder="Palavra (ex.: tirania)" maxlength="60" style="padding:10px;border-radius:10px;border:2px solid var(--ink);font:inherit">
      <textarea id="md" placeholder="Significado, com as suas palavras" maxlength="400" rows="2" style="padding:10px;border-radius:10px;border:2px solid var(--ink);font:inherit"></textarea>
      <button class="btn gold" onclick="addWord()">+ Adicionar palavra</button></div>
    <div class="terms" style="margin-top:12px">${S.mydict.length?S.mydict.map(([t,d],k)=>`<div class="term"><b>${escH(t)}</b>${escH(d)}<br><button class="pill" style="background:#eee;color:var(--ink);margin-top:6px" onclick="delWord(${k})">🗑️ apagar</button></div>`).join(""):`<p class="counter">Nenhuma palavra ainda.</p>`}</div>
    <h2 style="margin-top:20px">🔓 Palavras do jogo</h2><p class="counter">Complete as fases para desbloquear. Copie-as no seu caderno!</p><div class="terms">`;
  LEVELS.forEach((L,i)=>L.termos.forEach(([t,d])=>{
    h+= S.stars[i]!==undefined ? `<div class="term"><b>${t}</b>${d}</div>` : `<div class="term locked">🔒 Complete a fase “${L.titulo}”</div>`;
  }));
  app.innerHTML=h+`</div></div><div class="row"><button class="btn sec" onclick="window.print()">🖨️ Imprimir</button><button class="btn gold" onclick="go('map')">Voltar ao mapa</button></div>`;
}

/* ================= MOTOR DA FASE ================= */
let G, TMR=null;
function stopTimer(){ if(TMR){clearInterval(TMR);TMR=null;} }
function frame(era, pers, titulo, intro){
  return `<div class="scene">${sceneSVG(era)}</div>
  <div class="dialog"><div class="who">${charSVG(pers)}</div><div class="bubble"><b>${pers.nome}</b>${intro}</div></div>
  <div class="card">
    <h2>${titulo}</h2>
    <div class="status"><span class="hearts" id="hearts"></span><span class="combo" id="combo"></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap"><button class="pill" style="background:var(--gold);color:var(--ink)" id="hintBtn">💡 Dica (${HINT_COST}🪙)</button>
      <button class="pill" style="background:#e85a6a" id="buyBtn">+❤️ (${LIFE_COST}🪙)</button>
      <button class="pill" style="background:#b05ad0" id="resBtn"></button></span></div>
    <div class="timer" id="tbar" style="display:none"><i id="tfill" style="width:100%"></i></div>
    <div id="game" style="margin-top:10px"></div><div id="fb" class="fb" role="status"></div><div id="extra"></div>
  </div>
  <div class="row"><button class="btn sec" onclick="go('map')">← Mapa</button><span class="counter" style="color:#ddd">Toque ou arraste os itens</span></div>`;
}
function startLevel(o){
  G = Object.assign({lives:3, combo:0, errs:0, over:false, paused:false, second:false, hint:null}, o);
  drawStatus();
  document.getElementById("hintBtn").onclick=useHint;
  document.getElementById("buyBtn").onclick=buyLife;
  document.getElementById("resBtn").onclick=useReserve;
  if(G.time){
    let left=G.time; const bar=document.getElementById("tbar"), f=document.getElementById("tfill");
    bar.style.display="block";
    TMR=setInterval(()=>{ if(G.paused) return; left--; f.style.width=(left/G.time*100)+"%"; if(left<=0){stopTimer(); gameOver("O tempo acabou!");} },1000);
  }
}
function drawStatus(){
  document.getElementById("hearts").textContent="❤️".repeat(G.lives)+"🖤".repeat(Math.max(0,3-G.lives));
  const r=document.getElementById("resBtn"); if(r){ r.textContent=`💖 Reserva (${S.reserve||0})`; r.style.opacity=(S.reserve||0)?1:.5; }
  document.getElementById("combo").textContent=G.combo>=2?`🔥 Combo x${G.combo}`:"";
}
function fb(ok,msg){ const f=document.getElementById("fb"); if(!f) return; f.className="fb "+(ok?"ok":"err"); f.innerHTML=(ok?"✅ ":"❌ ")+msg; }
function good(msg, el){
  if(G.over) return;
  G.combo++; const gain = 1 + (G.combo>=3?1:0);
  if(G.combo%COMBO_LIFE===0 && G.lives<MAX_LIVES){ G.lives++; setTimeout(()=>{ SFX.win(); floatText("+1❤️ Combo!", document.getElementById("hearts")); },300); msg+=` <b>🔥 ${COMBO_LIFE} acertos seguidos: ganhou uma vida!</b>`; }
  S.coins+=gain; save(); hud(); SFX.ok(); setTimeout(SFX.coin,150);
  floatText(`+${gain}🪙${G.combo>=3?" 🔥":""}`, el); fb(true,msg); drawStatus();
}
function bad(msg, el){
  if(G.over) return;
  G.combo=0; G.errs++; G.lives--; SFX.err(); drawStatus();
  if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");}
  if(G.lives<=0) return G.second ? gameOver("Suas vidas acabaram!") : secondChance();
  fb(false,msg);
}
function useHint(){
  if(G.over || !G.hint) return;
  if(S.coins<HINT_COST){ SFX.err(); return fb(false,`Você precisa de ${HINT_COST} moedas para uma dica. Acerte mais para ganhar!`); }
  if(G.hint()!==false){ S.coins-=HINT_COST; save(); hud(); SFX.coin(); floatText(`-${HINT_COST}🪙`, document.getElementById("hintBtn")); }
}
function buyLife(){
  if(G.over||G.paused) return;
  if(G.lives>=MAX_LIVES){ SFX.err(); return fb(false,`Você já tem o máximo de ${MAX_LIVES} vidas.`); }
  if(S.coins<LIFE_COST){ SFX.err(); return fb(false,`Você precisa de ${LIFE_COST} moedas para comprar uma vida.`); }
  S.coins-=LIFE_COST; G.lives++; save(); hud(); drawStatus(); SFX.coin(); floatText("+1❤️", document.getElementById("hearts")); fb(true,"Vida extra comprada!");
}
function useReserve(){
  if(G.over||G.paused) return;
  if(!(S.reserve>0)){ SFX.err(); return fb(false,"Você não tem corações reserva. Termine uma fase sem nenhum erro para ganhar um!"); }
  if(G.lives>=MAX_LIVES){ SFX.err(); return fb(false,`Você já tem o máximo de ${MAX_LIVES} vidas.`); }
  S.reserve--; G.lives++; save(); drawStatus(); SFX.coin(); floatText("+1💖", document.getElementById("hearts")); fb(true,"Você usou um coração reserva!");
}
function secondChance(){
  G.second=true; G.paused=true;
  let pool=[]; LEVELS.forEach((L,k)=>{ if(S.stars[k]!==undefined || k===G.i) pool.push(...L.termos); });
  if(pool.length<4) LEVELS.slice(0,3).forEach(L=>pool.push(...L.termos));
  pool=pool.filter((t,k)=>pool.findIndex(x=>x[0]===t[0])===k);
  const picks=shuffle(pool).slice(0,2); let n=0, hits=0; const missed=[];
  const ov=document.createElement("div"); ov.className="overlay"; document.body.appendChild(ov);
  const ask=()=>{
    const [t,d]=picks[n], opts=shuffle([d,...shuffle(pool.filter(x=>x[0]!==t)).slice(0,2).map(x=>x[1])]);
    ov.innerHTML=`<div class="card pop"><div style="font-size:2.4rem;text-align:center">📖</div><h2 style="text-align:center">Segunda chance!</h2>
      <p>Suas vidas acabaram, mas o dicionário pode te salvar. <b>Cada acerto vale 1 ❤️.</b></p>
      <p class="counter">Palavra ${n+1} de 2 · Vidas ganhas: ${"❤️".repeat(hits)||"nenhuma ainda"}</p>
      <div class="statement">Qual é o significado de “${t}”?</div><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div></div>`;
    ov.querySelectorAll(".opt").forEach(bt=>bt.onclick=()=>{
      const ok=bt.textContent===d; bt.classList.add(ok?"right":"wrong");
      ov.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      if(ok){ hits++; SFX.ok(); } else { missed.push([t,d]); SFX.err(); }
      setTimeout(()=>{ n++; if(n<2) return ask(); done(); }, 1000);
    });
  };
  const done=()=>{
    ov.remove(); G.paused=false;
    const lição = missed.length ? " Fique de olho: "+missed.map(([t,d])=>`<b>${t}</b> significa: ${d}`).join(" · ") : "";
    if(hits){ G.lives=hits; drawStatus(); SFX.win(); fb(true,`Você voltou com ${hits} ${hits>1?"vidas":"vida"}! Leia com calma e continue.${lição}`); }
    else gameOver(`Não foi dessa vez.`, missed);
  };
  ask();
}
function gameOver(why, missed){
  G.over=true; stopTimer(); SFX.lose();
  const retry = G.boss?"go('boss')":`go('play',${G.i})`;
  app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">💥</div><h2>${why}</h2>
    <p>A engrenagem escapou desta vez. Mas cada tentativa te deixa mais preparado!</p>${missed&&missed.length?`<div class="terms" style="text-align:left;margin:10px 0">${missed.map(([t,d])=>`<div class="term"><b>${t}</b>${d}</div>`).join("")}</div>`:""}
    <p class="counter">Dica: as explicações que aparecem quando você acerta ajudam muito na próxima tentativa.</p>
    <div class="row" style="justify-content:center"><button class="btn sec" onclick="go('map')">Mapa</button><button class="btn gold" onclick="${retry}">Tentar de novo ↻</button></div></div>`;
}

function renderLevel(i){
  const L=LEVELS[i];
  app.innerHTML=frame(L.era, L.pers, (L.num?`Questão ${L.num}: `:"⭐ ")+L.titulo, L.pers.fala+`<br><span class="counter">${L.intro}</span>`);
  startLevel({i, extraDone:!L.extra, time:S.desafio?150:0});
  ({sort:gSort, tf:gTF, match:gMatch, order:gOrder, quiz:gQuiz})[L.tipo](L);
}
function mainDone(){
  if(G.over) return;
  const L=LEVELS[G.i];
  if(L.extra && !G.extraDone){
    const x=L.extra, ord=shuffle(x.opts.map((_,k)=>k));
    document.getElementById("extra").innerHTML=`<h3 style="margin-top:18px">⭐ Pergunta bônus</h3><div class="statement">${x.q}</div><div class="opts">`+
      ord.map(k=>`<button class="opt" data-k="${k}">${x.opts[k]}</button>`).join("")+`</div>`;
    G.hint=()=>{ const w=[...document.querySelectorAll("#extra .opt:not(.wrong)")].find(b=>+b.dataset.k!==x.certa); if(!w) return false; w.classList.add("wrong"); w.disabled=true; };
    document.querySelectorAll("#extra .opt").forEach(b=>b.onclick=()=>{
      if(G.extraDone||G.over) return;
      if(+b.dataset.k===x.certa){ b.classList.add("right"); G.extraDone=true; good(x.exp,b); setTimeout(finish,1600); }
      else { b.classList.add("wrong"); b.disabled=true; bad("Ainda não. Pense de novo!",b); }
    });
    document.getElementById("extra").scrollIntoView({behavior:"smooth",block:"center"});
  } else setTimeout(finish,1300);
}

/* ---------- classificar (arrastar ou tocar) ---------- */
function gSort(L){
  let sel=null; const left=new Set(L.itens.map((_,k)=>k)); const g=document.getElementById("game");
  g.innerHTML=`<div class="pool" id="pool">`+shuffle([...left]).map(k=>`<button class="chip" data-k="${k}">${L.itens[k][0]}</button>`).join("")+`</div>
    <div class="bins">`+L.bins.map((b,j)=>`<div class="bin" role="button" tabindex="0" data-b="${j}"><h4>${b}</h4><div></div></div>`).join("")+`</div>`;
  const bins=[...g.querySelectorAll(".bin")];
  const clearSel=()=>{ g.querySelectorAll("#pool .chip").forEach(x=>x.classList.remove("sel")); bins.forEach(b=>b.classList.remove("hint","over")); };
  function drop(chip, bin){
    if(G.over) return;
    const k=+chip.dataset.k, it=L.itens[k];
    if(L.bins[+bin.dataset.b]===it[1]){
      bin.querySelector("div").insertAdjacentHTML("beforeend",`<span class="chip done pop">${it[0]}</span>`);
      chip.remove(); sel=null; left.delete(k); clearSel(); good(it[2],bin);
      if(!left.size) mainDone();
    } else { clearSel(); sel=null; bad(`"${it[0]}" não vai em "${L.bins[+bin.dataset.b]}". Tente outro grupo!`, bin); }
  }
  g.querySelectorAll("#pool .chip").forEach(c=>{
    c.addEventListener("pointerdown",e=>{
      if(G.over) return;
      const sx=e.clientX, sy=e.clientY; let ghost=null, moved=false;
      c.setPointerCapture(e.pointerId);
      const mv=ev=>{
        if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ moved=true; ghost=c.cloneNode(true); ghost.classList.add("ghost"); document.body.appendChild(ghost); c.style.opacity=".3"; }
        if(ghost){ ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
          const over=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".bin"); bins.forEach(b=>b.classList.toggle("over",b===over)); }
      };
      const up=ev=>{
        c.removeEventListener("pointermove",mv); c.removeEventListener("pointerup",up); c.removeEventListener("pointercancel",up);
        if(ghost){ ghost.remove(); c.style.opacity=""; const b=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".bin"); bins.forEach(x=>x.classList.remove("over")); if(b) drop(c,b); }
        else { clearSel(); sel=c; c.classList.add("sel"); bins.forEach(b=>b.classList.add("hint")); SFX.click(); }
      };
      c.addEventListener("pointermove",mv); c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up);
    });
  });
  bins.forEach(b=>{ const act=()=>{ if(!sel) return fb(false,"Toque em um item (ou arraste-o) até um dos grupos."); drop(sel,b); };
    b.onclick=act; b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} }; });
  G.hint=()=>{
    const c = sel || g.querySelector("#pool .chip"); if(!c) return false;
    const target=bins.find(b=>L.bins[+b.dataset.b]===L.itens[+c.dataset.k][1]);
    clearSel(); sel=c; c.classList.add("sel"); target.classList.add("glow"); setTimeout(()=>target.classList.remove("glow"),2500);
    fb(true,`💡 "${L.itens[+c.dataset.k][0]}" vai no grupo destacado.`);
  };
}

/* ---------- verdadeiro ou falso ---------- */
function gTF(L){
  const ord=shuffle(L.itens.map((_,k)=>k)); let p=0, locked=false; const g=document.getElementById("game");
  const show=()=>{ const it=L.itens[ord[p]]; locked=false;
    g.innerHTML=`<p class="counter">Afirmação ${p+1} de ${ord.length}</p><div class="statement">${it[0]}</div>
      <div class="tf"><button class="btn" style="background:var(--ok)" data-v="1">👍 Verdadeiro</button><button class="btn" style="background:var(--err)" data-v="0">👎 Falso</button></div>`;
    G.hint=()=>{ if(locked) return false; const b=g.querySelector(`.tf .btn[data-v="${it[1]?1:0}"]`); b.classList.add("glow"); fb(true,"💡 Olhe o botão que está brilhando."); };
    g.querySelectorAll(".tf .btn").forEach(b=>b.onclick=()=>{
      if(locked||G.over) return;
      if((b.dataset.v==="1")===it[1]){ locked=true; good(it[2],b); p++;
        setTimeout(()=>{ if(G.over) return; if(p<ord.length){document.getElementById("fb").className="fb";show();} else {g.innerHTML="";mainDone();} },1900);
      } else bad("Hmm, releia com atenção e tente de novo.",b);
    });
  }; show();
}

/* ---------- ligar pares ---------- */
function gMatch(L){
  let selA=null, left=L.pares.length; const g=document.getElementById("game");
  g.innerHTML=`<p class="counter">Toque em um item da esquerda e depois no seu par.</p><div class="cols">
    <div class="opts" id="ca">`+shuffle(L.pares.map((_,k)=>k)).map(k=>`<button class="opt" data-k="${k}"><b>${L.pares[k][0]}</b></button>`).join("")+`</div>
    <div class="opts" id="cb">`+shuffle(L.pares.map((_,k)=>k)).map(k=>`<button class="opt" data-k="${k}">${L.pares[k][1]}</button>`).join("")+`</div></div>`;
  const pick=a=>{ g.querySelectorAll("#ca .opt").forEach(x=>x.classList.remove("pick")); selA=a; a.classList.add("pick"); SFX.click(); };
  g.querySelectorAll("#ca .opt").forEach(a=>a.onclick=()=>{ if(!a.disabled) pick(a); });
  g.querySelectorAll("#cb .opt").forEach(b=>b.onclick=()=>{
    if(b.disabled||G.over) return; if(!selA) return fb(false,"Primeiro toque em um item da coluna da esquerda.");
    if(selA.dataset.k===b.dataset.k){ const p=L.pares[+b.dataset.k];
      [selA,b].forEach(x=>{x.classList.remove("pick");x.classList.add("right");x.disabled=true;}); selA=null; good(p[2],b);
      if(!--left) mainDone();
    } else bad("Esse par não combina. Tente outro!",b);
  });
  G.hint=()=>{ const a=selA||g.querySelector("#ca .opt:not(:disabled)"); if(!a) return false; pick(a);
    const b=g.querySelector(`#cb .opt[data-k="${a.dataset.k}"]`); b.classList.add("glow"); setTimeout(()=>b.classList.remove("glow"),2500); fb(true,"💡 O par certo está brilhando."); };
}

/* ---------- ordenar ---------- */
function gOrder(L){
  let next=0; const g=document.getElementById("game");
  g.innerHTML=`<div class="order-list" id="ol"></div><p class="counter" style="margin-top:12px">Toque no próximo acontecimento:</p>
    <div class="opts" id="op">`+shuffle(L.itens.map((_,k)=>k)).map(k=>`<button class="opt" data-k="${k}">${L.itens[k][0]}</button>`).join("")+`</div>`;
  g.querySelectorAll("#op .opt").forEach(b=>b.onclick=()=>{
    if(G.over) return; const k=+b.dataset.k;
    if(k===next){ document.getElementById("ol").insertAdjacentHTML("beforeend",`<div class="order-slot pop">${L.itens[k][0]}</div>`); b.remove(); good(L.itens[k][1],document.getElementById("ol").lastElementChild); if(++next===L.itens.length) mainDone(); }
    else bad("Ainda não é a vez desse acontecimento. Qual veio antes?",b);
  });
  G.hint=()=>{ const b=g.querySelector(`#op .opt[data-k="${next}"]`); if(!b) return false; b.classList.add("glow"); setTimeout(()=>b.classList.remove("glow"),2500); fb(true,"💡 O próximo acontecimento está brilhando."); };
}

/* ---------- quiz ---------- */
function gQuiz(L){
  let p=0; const g=document.getElementById("game");
  const show=()=>{ const it=L.itens[p], ord=shuffle(it[1].map((_,k)=>k)); let ok=false;
    g.innerHTML=`<p class="counter">Situação ${p+1} de ${L.itens.length}</p><div class="statement">${it[0]}</div><div class="opts">`+
      ord.map(k=>`<button class="opt" data-k="${k}">${it[1][k]}</button>`).join("")+`</div>`;
    G.hint=()=>{ if(ok) return false; const w=[...g.querySelectorAll(".opt:not(.wrong)")].find(b=>+b.dataset.k!==it[2]); if(!w) return false; w.classList.add("wrong"); w.disabled=true; fb(true,"💡 Uma opção errada foi eliminada."); };
    g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(ok||G.over) return;
      if(+b.dataset.k===it[2]){ ok=true; b.classList.add("right"); good(it[3],b); p++;
        setTimeout(()=>{ if(G.over) return; if(p<L.itens.length){document.getElementById("fb").className="fb";show();} else {g.innerHTML="";mainDone();} },1900);
      } else { b.classList.add("wrong"); b.disabled=true; bad("Não era isso. Tente outra opção!",b); }
    });
  }; show();
}

/* ================= FIM DA FASE ================= */
function finish(){
  if(G.over) return; G.over=true; stopTimer();
  const i=G.i, L=LEVELS[i], st=G.errs<=1?3:G.errs<=3?2:1, novo=S.stars[i]===undefined;
  let resMsg=""; if(G.errs===0){ if((S.reserve||0)<MAX_RESERVE){ S.reserve=(S.reserve||0)+1; resMsg=" · 💖 Fase sem erros: você ganhou um coração reserva!"; } else resMsg=" · 💖 Reserva cheia (3)."; }
  const bonus = 5 + st*2 + Math.min(G.lives,5); S.coins+=bonus;
  S.stars[i]=Math.max(S.stars[i]||0,st); save(); hud(); SFX.win();
  window.scrollTo(0,0);
  app.innerHTML=`<div class="card" style="text-align:center">
    <svg viewBox="-30 -30 60 60" width="90" class="pop">${gearSVG(26,"#e0a82e",true)}</svg>
    <h2>${novo?"Engrenagem recuperada!":"Fase concluída!"}</h2>
    <div class="big-stars" aria-label="${st} de 3 estrelas">${starStr(st)}</div>
    <p class="counter">Erros: ${G.errs} · Bônus: +${bonus} 🪙${st<3?" · Jogue de novo para conseguir 3 estrelas!":" · Excelente!"}${resMsg}</p>
  </div>
  <div class="card"><h2>📖 ${novo?"Novas palavras no dicionário":"Palavras desta fase"}</h2><div class="terms">
    ${L.termos.map(([t,d])=>`<div class="term"><b>${t}</b>${d}</div>`).join("")}</div></div>
  <div class="card"><h2>✍️ ${L.num?`Agora, a questão ${L.num}`:"Questão de revisão"}</h2>${L.num?"":`<p class="counter">Esta pergunta não está nas atividades suplementares, mas treina a habilidade <b>${L.hab}</b> dos capítulos da trilha.</p>`}
    <div class="qbox">${L.pergunta}</div>
    <h3 style="margin-top:16px">Como montar a resposta</h3>
    <ol class="steps">${L.passos.map(p=>`<li>${p}</li>`).join("")}</ol>
    <div class="warn">⚠️ <b>Atenção:</b> ${L.cuidado}</div>
    <h3 style="margin-top:16px">Exemplo de resposta completa</h3>
    <p class="counter">Tente pensar na sua resposta antes de abrir o exemplo.</p>
    <div id="mdl"><button class="btn sec" onclick="SFX.click();this.parentNode.innerHTML=document.getElementById('mdlT').innerHTML">Mostrar exemplo de resposta</button></div>
    <template id="mdlT"><div class="model">${L.modelo}</div>
      <p class="counter">As partes <mark>destacadas</mark> são as ideias que não podem faltar. Agora escreva <b>com as suas palavras</b> no caderno. Não copie!</p></template>
  </div>
  <div class="row"><button class="btn sec" onclick="go('play',${i})">Jogar de novo</button>
    ${i<NL-1?`<button class="btn gold" onclick="go('play',${i+1})">Próxima fase →</button>`:`<button class="btn gold" onclick="go('map')">Ir para o Desafio Final ⚙️</button>`}</div>`;
}

/* ================= FASE FINAL ================= */
function bossPool(){
  const q=[];
  LEVELS.forEach(L=>{
    if(L.tipo==="sort") L.itens.forEach(it=>q.push({q:`Onde se encaixa: “${it[0]}”?`, opts:L.bins, c:it[1], exp:it[2]}));
    if(L.tipo==="tf") L.itens.forEach(it=>q.push({q:`Verdadeiro ou falso: “${it[0]}”`, opts:["Verdadeiro","Falso"], c:it[1]?"Verdadeiro":"Falso", exp:it[2]}));
    if(L.tipo==="quiz") L.itens.forEach(it=>q.push({q:it[0], opts:it[1], c:it[1][it[2]], exp:it[3]}));
    if(L.tipo==="match") L.pares.forEach(p=>q.push({q:`Complete: “${p[0]}” →`, opts:L.pares.map(x=>x[1]), c:p[1], exp:p[2]}));
    if(L.tipo==="order") q.push({q:`Qual destes aconteceu PRIMEIRO? (${L.titulo})`, opts:L.itens.slice(0,4).map(x=>x[0]), c:L.itens[0][0], exp:L.itens[0][1]});
  });
  return shuffle(q).slice(0,12);
}
const BOSS_PERS={nome:"Máquina do Tempo",pele:"#c9c2e6",roupa:"#5b4a8a",cabelo:"#e0a82e",acc:""};
function renderBoss(){
  const Q=bossPool(); let p=0;
  app.innerHTML=frame("boss", BOSS_PERS, "⚙️ Desafio da Máquina", "BIP-BOP! Para religar, responda 12 perguntas das três eras antes que o tempo acabe. Você tem 3 vidas!");
  startLevel({boss:true, time:180});
  const g=document.getElementById("game");
  const show=()=>{ const it=Q[p]; let ok=false;
    g.innerHTML=`<p class="counter">Pergunta ${p+1} de ${Q.length}</p><div class="statement">${it.q}</div><div class="opts">`+
      shuffle(it.opts).map(o=>`<button class="opt">${o}</button>`).join("")+`</div>`;
    G.hint=()=>{ if(ok) return false; const w=[...g.querySelectorAll(".opt:not(.wrong)")].find(b=>b.textContent!==it.c); if(!w) return false; w.classList.add("wrong"); w.disabled=true; fb(true,"💡 Uma opção errada foi eliminada."); };
    g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(ok||G.over) return;
      if(b.textContent===it.c){ ok=true; b.classList.add("right"); good(it.exp,b); p++;
        setTimeout(()=>{ if(G.over) return; if(p<Q.length){document.getElementById("fb").className="fb";show();} else bossWin(); },1500);
      } else { b.classList.add("wrong"); b.disabled=true; bad("Errou! A máquina soltou faísca. ⚡",b); }
    });
  }; show();
}
function bossWin(){
  G.over=true; stopTimer(); S.boss=true; S.coins+=30; save(); hud(); SFX.win(); setTimeout(SFX.win,600);
  app.innerHTML=`<div class="card" style="padding:0;overflow:hidden">${sceneSVG("boss")}</div>
  <div class="card" style="text-align:center"><h1>🏆 Máquina religada!</h1>
    <p>Você atravessou a Grécia, Roma e a Idade Média e voltou para casa. Parabéns, viajante do tempo!</p>
    <p><b>Última missão:</b> pegue o caderno e escreva as <b>10 respostas</b> com as suas palavras, usando os roteiros que você aprendeu.</p>
    <div class="row" style="justify-content:center"><button class="btn sec" onclick="go('dict')">📖 Revisar dicionário</button><button class="btn gold" onclick="go('map')">Voltar ao mapa</button></div></div>`;
}

go("title");
</script>
